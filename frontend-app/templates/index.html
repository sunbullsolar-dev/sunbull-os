// ===== COMPLETION MODAL (OUTCOME ENGINE UI WITH STRUCTURED EXECUTION) =====
function CompleteModal({appt,lead,onClose,onDone}){
    const{af,user}=useA();const toast=useT();
    const[outcome,setOC]=useState("");const[notes,setN]=useState("");const[fuDate,setFD]=useState("");const[fuNote,setFN]=useState("");const[busy,setBsy]=useState(false);const[showPressure,setSP]=useState(false);const[rankInfo,setRankInfo]=useState(null);
    // Structured execution fields
    const[hoPresent,setHO]=useState(null);const[dmPresent,setDM]=useState(null);const[pitchDone,setPitch]=useState(null);const[propSent,setPropSent]=useState(null);

    const HELD=["closed","proposal_presented","proposal_sent","follow_up_required","declined"];
    const NOT_HELD=["no_show","not_home","canceled","reschedule_requested"];
    const NEEDS_FU=["proposal_presented","proposal_sent","follow_up_required","not_home","reschedule_requested"];
    const isHeld=HELD.includes(outcome);
    const needsFU=NEEDS_FU.includes(outcome);

    // Structured fields required for held appointments
    const structuredComplete=!isHeld||(hoPresent!==null&&dmPresent!==null&&pitchDone!==null);
    const fuComplete=!needsFU||(fuDate&&fuNote.trim());
    const canSubmit=outcome&&notes.trim()&&structuredComplete&&fuComplete;

    const submit=async()=>{
        if(!canSubmit){toast("err","Complete all required fields");return}
        setBsy(true);
        try{
            const body={outcome,notes,follow_up_date:fuDate||null,follow_up_note:fuNote||null};
            if(isHeld){body.homeowner_present=hoPresent;body.decision_maker_present=dmPresent;body.pitch_delivered=pitchDone;body.proposal_sent=propSent||false}
            const r=await af(`/api/appointments/${appt.id}/complete`,{method:"POST",body:JSON.stringify(body)});
            if(r.ok){toast("ok","Outcome recorded!");try{const lr=await af("/api/admin/leaderboard");if(lr.ok){const ld=await lr.json();const me=ld.leaderboard?.find(x=>x.rep_id===user?.id);const above=me&&ld.leaderboard?.find(x=>x.rank===me.rank-1);setRankInfo({rank:me?.rank,total:ld.total_reps,above:above?.name,myScore:me?.daily_score})}}catch{}setSP(true)}
            else{const d=await r.json().catch(()=>({}));toast("err",d.detail||"Failed")}
        }catch{toast("err","Error")}
        setBsy(false);
    };

    // Y/N toggle button
    const YN=({label,val,set,req})=>(
        <div style={{marginBottom:8}}>
            <div style={{fontSize:10,fontWeight:800,color:"#52525b",textTransform:"uppercase",marginBottom:4}}>{label}{req&&<span style={{color:"#ef4444"}}> *</span>}</div>
            <div style={{display:"flex",gap:4}}>
                <button className={`btn ${val===true?"btn-g":""}`} style={{flex:1,padding:"8px",fontSize:12,fontWeight:700}} onClick={()=>set(true)}>YES</button>
                <button className={`btn ${val===false?"btn-r":""}`} style={{flex:1,padding:"8px",fontSize:12,fontWeight:700}} onClick={()=>set(false)}>NO</button>
            </div>
        </div>
    );

    // Progress
    const steps=[];
    steps.push({done:!!outcome,l:"Outcome"});
    if(isHeld){steps.push({done:hoPresent!==null,l:"HO Present"});steps.push({done:dmPresent!==null,l:"DM Present"});steps.push({done:pitchDone!==null,l:"Pitch"})}
    steps.push({done:!!notes.trim(),l:"Notes"});
    if(needsFU)steps.push({done:!!fuDate&&!!fuNote.trim(),l:"Follow-up"});
    const done=steps.filter(s=>s.done).length;

    return(
        <div className="modal-ov" onClick={e=>e.preventDefault()} style={{cursor:"not-allowed"}}><div className="modal" onClick={e=>e.stopPropagation()} style={{width:'100%',maxWidth:620,cursor:"default"}}>
            {showPressure ? (
                <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:32,textAlign:"center"}}>
                    {outcome==="closed"&&<div style={{fontSize:42,fontWeight:900,color:"#22c55e",marginBottom:16}}>DEAL CLOSED!</div>}
                    <div style={{fontSize:14,color:"#71717a",marginBottom:20}}>Create a project to record contract value and commission.</div>
                    {rankInfo&&rankInfo.rank&&<div style={{background:"#18181b",borderRadius:10,padding:14,marginBottom:16,width:"100%",maxWidth:300}}>
                        <div style={{fontSize:20,fontWeight:900,color:rankInfo.rank<=3?"#f59e0b":"#a1a1aa"}}>Rank #{rankInfo.rank}</div>
                    </div>}
                    <button className="btn btn-p" style={{padding:"12px 24px",fontSize:14,fontWeight:800}} onClick={onDone}>Continue</button>
                </div>
            ) : (
                <>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                        <div><h3 style={{fontSize:16,fontWeight:800}}>Complete Appointment</h3>{lead&&<div style={{fontSize:12,color:"#52525b"}}>{lead.first_name} {lead.last_name}</div>}</div>
                    </div>
                    {/* Progress bar */}
                    <div style={{marginBottom:14,padding:10,background:"#18181b",borderRadius:8}}>
                        <div style={{display:"flex",gap:2,marginBottom:4}}>
                            {steps.map((s,i)=><div key={i} style={{flex:1,height:5,background:s.done?"#f59e0b":"#27272a",borderRadius:3}}/>)}
                        </div>
                        <div style={{fontSize:10,color:"#71717a"}}>{done}/{steps.length} — {steps.filter(s=>!s.done).map(s=>s.l).join(", ")||"All complete"}</div>
                    </div>
                    {/* Outcome selection */}
                    <div style={{marginBottom:12}}>
                        <div style={{fontSize:10,fontWeight:800,color:"#22c55e",textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>Held</div>
                        <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:8}}>
                            {HELD.map(o=><button key={o} className={`btn ${outcome===o?"btn-p":""}`} style={{fontSize:11}} onClick={()=>setOC(o)}>{sL(o)}</button>)}
                        </div>
                        <div style={{fontSize:10,fontWeight:800,color:"#ef4444",textTransform:"uppercase",letterSpacing:".05em",marginBottom:4}}>Not Held</div>
                        <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                            {NOT_HELD.map(o=><button key={o} className={`btn ${outcome===o?"btn-r btn-p":""}`} style={{fontSize:11}} onClick={()=>setOC(o)}>{sL(o)}</button>)}
                        </div>
                    </div>
                    {/* STRUCTURED EXECUTION FIELDS — only for held outcomes */}
                    {isHeld&&<div style={{background:"#0a1628",border:"1px solid #1e3a5f",borderRadius:8,padding:12,marginBottom:12}}>
                        <div style={{fontSize:10,fontWeight:800,color:"#3b82f6",textTransform:"uppercase",letterSpacing:".05em",marginBottom:8}}>Execution Checklist (required)</div>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                            <YN label="Homeowner Present" val={hoPresent} set={setHO} req/>
                            <YN label="Decision Maker Present" val={dmPresent} set={setDM} req/>
                            <YN label="Pitch Delivered" val={pitchDone} set={setPitch} req/>
                            <YN label="Proposal Sent" val={propSent} set={setPropSent}/>
                        </div>
                    </div>}
                    {/* Notes */}
                    <div style={{marginBottom:12}}>
                        <label style={{display:"block",fontSize:10,fontWeight:800,color:"#52525b",marginBottom:4,textTransform:"uppercase"}}>Notes <span style={{color:"#ef4444"}}>*</span></label>
                        <textarea className="inp" value={notes} onChange={e=>setN(e.target.value)} placeholder="What happened at this appointment..." style={{minHeight:60}}/>
                    </div>
                    {/* Follow-up */}
                    {needsFU&&<div style={{background:"#f59e0b08",border:"1px solid #f59e0b30",borderRadius:8,padding:12,marginBottom:12}}>
                        <div style={{fontSize:10,fontWeight:800,color:"#f59e0b",marginBottom:6,textTransform:"uppercase"}}>Follow-up Required</div>
                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
                            <div><label style={{fontSize:10,fontWeight:700,color:"#52525b",display:"block",marginBottom:3}}>Date *</label><input className="inp" type="date" min={new Date().toISOString().split("T")[0]} value={fuDate} onChange={e=>setFD(e.target.value)}/></div>
                            <div><label style={{fontSize:10,fontWeight:700,color:"#52525b",display:"block",marginBottom:3}}>Note *</label><input className="inp" value={fuNote} onChange={e=>setFN(e.target.value)} placeholder="Follow-up details"/></div>
                        </div>
                    </div>}
                    <button className="btn btn-p" style={{width:"100%",padding:12,fontSize:13,fontWeight:800}} disabled={busy||!canSubmit} onClick={submit}>{busy?"Processing...":"SUBMIT OUTCOME"}</button>
                </>
            )}
        </div></div>
    );
}

// LEADS PAGE — MONDAY.COM-STYLE GROUPED BOARD VIEW
// ========================================================================
function LeadsPage(){
    const{af,user}=useA();const toast=useT();
    const[leads,sLeads]=useState([]);const[reps,sReps]=useState([]);const[appts,sAppts]=useState([]);const[loading,sLd]=useState(true);
    const[search,sSrch]=useState("");const[sf,sSF]=useState("");const[repFilter,setRepFilter]=useState("");const[cityFilter,setCityFilter]=useState("");
    const[sel,sSel]=useState(null);const[viewMode,setViewMode]=useState("board");
    const[showCreate,setSC]=useState(false);const[showCreateAppt,setSCA]=useState(null);
    const[collapsedGroups,setCollapsed]=useState({});
    const[inlineStatus,setInlineStatus]=useState(null);const[inlineOutcome,setInlineOutcome]=useState(null);

    useEffect(()=>{loadLeads();if(user?.role==="admin")loadReps()},[]);
    const h=useH();
    useEffect(()=>{const p=new URLSearchParams(h.split("?")[1]||"");const id=p.get("id");if(id&&leads.length){const l=leads.find(x=>x.id===parseInt(id));if(l)sSel(l)}},[h,leads]);

    const loadLeads=async()=>{sLd(true);try{
        const[lr,ar]=await Promise.all([af("/api/leads?limit=500"),af("/api/appointments")]);
        if(lr.ok){const d=await lr.json();sLeads(Array.isArray(d)?d:(d.items||[]))}
        if(ar.ok){const d=await ar.json();sAppts(Array.isArray(d)?d:[])}
    }catch(e){}sLd(false)};
    const loadReps=async()=>{try{const r=await af("/api/admin/reps");if(r.ok){const d=await r.json();const list=Array.isArray(d)?d:(d.reps||d.items||[]);sReps(list.map(x=>({...x,full_name:x.full_name||x.name||x.email||"Unknown"})))}}catch{}};

    const filtered=useMemo(()=>leads.filter(l=>{
        const ms=!search||`${l.first_name||""} ${l.last_name||""} ${l.city||""} ${l.phone||""} ${l.email||""}`.toLowerCase().includes(search.toLowerCase());
        const mf=!sf||l.deal_status===sf;
        const rf=!repFilter||l.assigned_rep_id===parseInt(repFilter);
        const cf=!cityFilter||l.city?.toLowerCase().includes(cityFilter.toLowerCase());
        return ms&&mf&&rf&&cf;
    }),[leads,search,sf,repFilter,cityFilter]);

    // Build appointments lookup
    const apptMap=useMemo(()=>{const m={};appts.forEach(a=>{if(!m[a.lead_id])m[a.lead_id]=[];m[a.lead_id].push(a)});return m},[appts]);
    const repsMap=useMemo(()=>{const m={};reps.forEach(r=>m[r.id]=r);return m},[reps]);

    // GROUPED SECTIONS (like Monday.com)
    const today=new Date().toISOString().split("T")[0];
    const tomorrow=new Date(Date.now()+86400000).toISOString().split("T")[0];
    const groups=useMemo(()=>{
        const todayAppts=[];const callbacks=[];const dispatchReady=[];const followUp=[];const upcoming=[];const sold=[];const lost=[];const newLeads=[];const other=[];
        filtered.forEach(l=>{
            const la=apptMap[l.id]||[];
            const todayA=la.find(a=>a.appointment_date===today&&!["completed","cancelled","no_show"].includes(a.appointment_status));
            const upA=la.find(a=>a.appointment_date>today&&!["completed","cancelled","no_show"].includes(a.appointment_status));
            const dispatched=la.find(a=>["en_route","arrived"].includes(a.appointment_status));
            if(dispatched){dispatchReady.push(l)}
            else if(todayA){todayAppts.push(l)}
            else if(l.deal_status==="closed_won"){sold.push(l)}
            else if(l.deal_status==="closed_lost"||l.deal_status==="cancelled"){lost.push(l)}
            else if(l.deal_status==="follow_up"||l.follow_up_required){callbacks.push(l)}
            else if(l.deal_status==="new"){newLeads.push(l)}
            else if(upA){upcoming.push(l)}
            else{other.push(l)}
        });
        return[
            {key:"dispatch",label:"Dispatch Ready",color:"#ef4444",items:dispatchReady},
            {key:"today",label:"Today's Appointments",color:"#22c55e",items:todayAppts},
            {key:"callbacks",label:"Callbacks / Follow Up",color:"#f59e0b",items:callbacks},
            {key:"upcoming",label:"Upcoming Appointments",color:"#3b82f6",items:upcoming},
            {key:"new",label:"New Leads",color:"#3b82f6",items:newLeads},
            {key:"sold",label:"Sold",color:"#22c55e",items:sold},
            {key:"lost",label:"Lost / Cancelled",color:"#ef4444",items:lost},
            {key:"other",label:"Other",color:"#52525b",items:other},
        ].filter(g=>g.items.length>0);
    },[filtered,apptMap]);

    // Inline status/outcome update
    const quickUpdateStatus=async(leadId,s)=>{try{const r=await af(`/api/leads/${leadId}`,{method:"PUT",body:JSON.stringify({deal_status:s})});if(r.ok){toast("ok",sL(s));setInlineStatus(null);loadLeads()}}catch{toast("err","Failed")}};
    const quickUpdateOutcome=async(leadId,o)=>{try{const r=await af(`/api/leads/${leadId}`,{method:"PUT",body:JSON.stringify({last_outcome:o})});if(r.ok){toast("ok",sL(o));setInlineOutcome(null);loadLeads()}}catch{toast("err","Failed")}};
    const toggleGroup=k=>setCollapsed(p=>({...p,[k]:!p[k]}));

    const statuses=["new","confirmed","appointed","dispatched","closed_won","closed_lost","follow_up","no_show","rehash"];
    const outcomeLabels=["no_answer","lvm","follow_up","needs_reschedule","call_back","not_interested","not_home","sold","cancelled","just_show_up","same_day","zoom","phone_appt","disconnected","wrong_number"];
    const outcomeColors={no_answer:"#f59e0b",lvm:"#eab308",follow_up:"#3b82f6",needs_reschedule:"#a855f7",call_back:"#22c55e",not_interested:"#ef4444",not_home:"#f59e0b",sold:"#22c55e",cancelled:"#ef4444",just_show_up:"#22c55e",same_day:"#3b82f6",zoom:"#a855f7",phone_appt:"#3b82f6",disconnected:"#ef4444",wrong_number:"#ef4444"};

    // Column header
    const COLS="2.2fr 1.5fr .7fr .6fr .9fr .9fr 1.8fr .7fr";
    const ColHead=()=><div style={{display:"grid",gridTemplateColumns:COLS,padding:"6px 12px",fontSize:9,fontWeight:800,color:"#3f3f46",textTransform:"uppercase",letterSpacing:".06em",borderBottom:"1px solid #18181b"}}><div>Name</div><div>Address</div><div>Phone</div><div>Appt</div><div>Status</div><div>Outcome</div><div>Comments</div><div>Rep</div></div>;

    // Lead row
    const LeadRow=({l})=>{
        const la=(apptMap[l.id]||[]).filter(a=>!["completed","cancelled","no_show"].includes(a.appointment_status)).sort((a,b)=>`${a.appointment_date}${a.appointment_time||""}`.localeCompare(`${b.appointment_date}${b.appointment_time||""}`))[0];
        const rep=repsMap[l.assigned_rep_id];
        const isInlineS=inlineStatus===l.id;const isInlineO=inlineOutcome===l.id;
        return(
            <div className="tr" style={{gridTemplateColumns:COLS,position:"relative"}} onClick={()=>sSel(l)}>
                {/* NAME + PHONE */}
                <div style={{minWidth:0}}>
                    <div style={{fontWeight:700,fontSize:12,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l.first_name} {l.last_name}</div>
                    {l.phone&&<a href={`tel:${l.phone}`} style={{fontSize:10,color:"#3b82f6",textDecoration:"none"}} onClick={e=>e.stopPropagation()}>{l.phone}</a>}
                </div>
                {/* ADDRESS */}
                <div style={{fontSize:11,color:"#71717a",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l.property_address?`${l.property_address}, ${l.city||""}`:`${l.city||""}, ${l.state||""}`}</div>
                {/* BILL */}
                <div style={{fontWeight:700,color:"#f59e0b",fontSize:12}}>{$.money(l.average_monthly_bill)}</div>
                {/* APPOINTMENT */}
                <div style={{fontSize:10}}>{la?<span style={{color:"#3b82f6",fontWeight:600}}>{$.date(la.appointment_date)} {$.t12(la.appointment_time)}</span>:<span style={{color:"#27272a"}}>--</span>}</div>
                {/* STATUS — INLINE CLICKABLE */}
                <div style={{position:"relative"}} onClick={e=>{e.stopPropagation();setInlineStatus(isInlineS?null:l.id);setInlineOutcome(null)}}>
                    <span className={`badge ${sB(l.deal_status)}`} style={{cursor:"pointer",fontSize:10,padding:"3px 8px"}}>{sL(l.deal_status)}</span>
                    {isInlineS&&<div style={{position:"absolute",top:"100%",left:0,zIndex:20,background:"#111113",border:"1px solid #27272a",borderRadius:8,padding:4,display:"flex",flexWrap:"wrap",gap:2,width:200,boxShadow:"0 8px 30px #00000080"}} onClick={e=>e.stopPropagation()}>
                        {statuses.map(s=><button key={s} className={`btn ${l.deal_status===s?"btn-p":""}`} style={{fontSize:9,padding:"3px 7px"}} onClick={()=>quickUpdateStatus(l.id,s)}>{sL(s)}</button>)}
                    </div>}
                </div>
                {/* OUTCOME — INLINE CLICKABLE */}
                <div style={{position:"relative"}} onClick={e=>{e.stopPropagation();setInlineOutcome(isInlineO?null:l.id);setInlineStatus(null)}}>
                    {l.last_outcome?<span className="badge" style={{cursor:"pointer",fontSize:10,padding:"3px 8px",background:(outcomeColors[l.last_outcome]||"#52525b")+"18",color:outcomeColors[l.last_outcome]||"#52525b"}}>{sL(l.last_outcome)}</span>:<span style={{fontSize:10,color:"#27272a",cursor:"pointer"}}>--</span>}
                    {isInlineO&&<div style={{position:"absolute",top:"100%",left:0,zIndex:20,background:"#111113",border:"1px solid #27272a",borderRadius:8,padding:4,display:"flex",flexWrap:"wrap",gap:2,width:240,boxShadow:"0 8px 30px #00000080"}} onClick={e=>e.stopPropagation()}>
                        {outcomeLabels.map(o=><button key={o} className="btn" style={{fontSize:9,padding:"3px 7px",color:outcomeColors[o]||"#a1a1aa",borderColor:(outcomeColors[o]||"#27272a")+"40"}} onClick={()=>quickUpdateOutcome(l.id,o)}>{sL(o)}</button>)}
                    </div>}
                </div>
                {/* COMMENTS PREVIEW */}
                <div style={{fontSize:10,color:"#52525b",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{l.notes||"--"}</div>
                {/* REP */}
                <div style={{fontSize:10}}>
                    {rep?<div style={{display:"flex",alignItems:"center",gap:4}}>
                        <div style={{width:20,height:20,borderRadius:"50%",background:"#f59e0b18",display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:800,color:"#f59e0b"}}>{(rep.full_name||"?")[0]}</div>
                        <span style={{fontSize:10,color:"#71717a",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{rep.full_name?.split(" ")[0]}</span>
                    </div>:<span style={{color:"#27272a"}}>--</span>}
                </div>
            </div>
        );
    };

    if(loading)return<Spin/>;

    // Count stats
    const totalAppts=leads.filter(l=>(apptMap[l.id]||[]).some(a=>a.appointment_date===today&&!["completed","cancelled","no_show"].includes(a.appointment_status))).length;
    const totalFollowUp=leads.filter(l=>l.deal_status==="follow_up"||l.follow_up_required).length;
    const totalSold=leads.filter(l=>l.deal_status==="closed_won").length;

    return(
        <div>
            <PH title="Leads" sub={`${leads.length} total`} right={<div style={{display:"flex",gap:6,alignItems:"center"}}>
                <button className={`btn ${viewMode==="board"?"btn-p":""}`} style={{fontSize:11}} onClick={()=>setViewMode("board")}>Board</button>
                <button className={`btn ${viewMode==="table"?"btn-p":""}`} style={{fontSize:11}} onClick={()=>setViewMode("table")}>Table</button>
                {user?.role==="admin"&&<button className="btn btn-p" onClick={()=>setSC(true)}><Ic d={IC.plus} s={12}/> New Lead</button>}
                <button className="btn" onClick={loadLeads}><Ic d={IC.refresh} s={12}/></button>
            </div>}/>

            {/* KPI BAR */}
            <div style={{padding:"8px 24px",display:"flex",gap:8,flexWrap:"wrap",borderBottom:"1px solid #18181b"}}>
                <KPI l="Total" v={leads.length}/><KPI l="Today's Appts" v={totalAppts} t={totalAppts>0?"warn":null}/><KPI l="Follow Up" v={totalFollowUp} t={totalFollowUp>0?"warn":null}/><KPI l="Sold" v={totalSold} t="ok"/>
            </div>

            {/* FILTER BAR */}
            <div style={{padding:"10px 24px",display:"flex",gap:8,flexWrap:"wrap",borderBottom:"1px solid #18181b"}}>
                <div style={{position:"relative",flex:1,minWidth:200,maxWidth:300}}><div style={{position:"absolute",left:10,top:"50%",transform:"translateY(-50%)",color:"#3f3f46"}}><Ic d={IC.search} s={13}/></div><input className="inp" style={{paddingLeft:32}} placeholder="Search name, phone, city..." value={search} onChange={e=>sSrch(e.target.value)}/></div>
                <select className="inp" style={{minWidth:120}} value={sf} onChange={e=>sSF(e.target.value)}><option value="">Status: All</option>{statuses.map(s=><option key={s} value={s}>{sL(s)}</option>)}</select>
                {user?.role==="admin"&&reps.length>0&&<select className="inp" style={{minWidth:120}} value={repFilter} onChange={e=>setRepFilter(e.target.value)}><option value="">Rep: All</option>{reps.map(r=><option key={r.id} value={r.id}>{r.full_name}</option>)}</select>}
                <input className="inp" style={{minWidth:100}} placeholder="City..." value={cityFilter} onChange={e=>setCityFilter(e.target.value)}/>
                {(search||sf||repFilter||cityFilter)&&<button className="btn" style={{fontSize:10}} onClick={()=>{sSrch("");sSF("");setRepFilter("");setCityFilter("")}}>Clear</button>}
            </div>

            <div style={{padding:"12px 24px"}}>
                {/* ===== BOARD VIEW (Monday.com style grouped) ===== */}
                {viewMode==="board"&&<div>
                    {groups.map(g=>(
                        <div key={g.key} style={{marginBottom:8}}>
                            {/* GROUP HEADER */}
                            <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 0",cursor:"pointer",userSelect:"none"}} onClick={()=>toggleGroup(g.key)}>
                                <div style={{width:6,height:24,borderRadius:3,background:g.color}}/>
                                <span style={{fontSize:13,fontWeight:800,color:g.color}}>{g.label}</span>
                                <span style={{fontSize:11,color:"#52525b"}}>{g.items.length} item{g.items.length!==1?"s":""}</span>
                                <Ic d={collapsedGroups[g.key]?"M6 9l6 6 6-6":"M18 15l-6-6-6 6"} s={12} c="#3f3f46"/>
                                {/* Mini status bar */}
                                <div style={{display:"flex",gap:1,marginLeft:"auto"}}>
                                    {statuses.map(s=>{const c=g.items.filter(l=>l.deal_status===s).length;return c>0?<div key={s} style={{width:Math.max(c*4,4),height:6,borderRadius:2,background:sB(s)==="b-green"?"#22c55e":sB(s)==="b-red"?"#ef4444":sB(s)==="b-yellow"?"#f59e0b":sB(s)==="b-blue"?"#3b82f6":sB(s)==="b-purple"?"#a855f7":"#3f3f46"}} title={`${sL(s)}: ${c}`}/>:null})}
                                </div>
                            </div>
                            {/* GROUP TABLE */}
                            {!collapsedGroups[g.key]&&<div className="cd" style={{overflow:"hidden",marginBottom:4}}>
                                <ColHead/>
                                {g.items.map(l=><LeadRow key={l.id} l={l}/>)}
                            </div>}
                        </div>
                    ))}
                    {groups.length===0&&<div className="cd"><Empty icon={IC.search} title="No leads match filters" sub="Try adjusting your search or filter criteria"/></div>}
                </div>}

                {/* ===== TABLE VIEW (flat list) ===== */}
                {viewMode==="table"&&<div className="cd" style={{overflow:"hidden"}}>
                    <ColHead/>
                    {filtered.length===0&&<Empty icon={IC.users} title="No leads" sub="Create your first lead or submit an appointment at /submit"/>}
                    {filtered.map(l=><LeadRow key={l.id} l={l}/>)}
                </div>}
            </div>

            {sel&&<LeadDrawer lead={sel} reps={reps} allLeads={filtered} onClose={()=>sSel(null)} onRefresh={loadLeads} onCreateAppt={setSCA} onNextLead={(nextL)=>{sSel(nextL)}}/>}
            {showCreate&&<CreateLeadModal onClose={()=>setSC(false)} onDone={()=>{setSC(false);loadLeads()}}/>}
            {showCreateAppt&&<CreateApptModal lead={showCreateAppt} reps={reps} onClose={()=>setSCA(null)} onDone={()=>{setSCA(null);loadLeads()}}/>}
        </div>
    );
}

// ===== LEAD COMMAND PANEL — HIGH-PERFORMANCE SALES EXECUTION ENGINE =====
function LeadDrawer({lead,reps,allLeads,onClose,onRefresh,onCreateAppt,onNextLead}){
    const{af,user}=useA();const toast=useT();
    const[timeline,sTL]=useState([]);const[tasks,sTasks]=useState([]);const[appts,sAppts]=useState([]);
    const[lockInfo,sLock]=useState(null);const[deleting,sDel]=useState(false);
    const[noteText,setNote]=useState("");const[noteType,setNoteType]=useState("general");const[notesBusy,setNB]=useState(false);
    const[statusDD,setStatusDD]=useState(false);const[outcomeDD,setOutcomeDD]=useState(false);
    const[assignDD,setAssignDD]=useState(false);const[showAdmin,setShowAdmin]=useState(false);
    const[leaderboard,setLB]=useState(null);
    // FORCE ACTION LOG: after status change or call, require note before closing
    const[pendingAction,setPendingAction]=useState(null);// {type:"status_change"|"call"|"outcome_change",label:string}
    const[actionLogged,setActionLogged]=useState(false);
    // NEXT LEAD suggestion
    const[showNextLead,setShowNextLead]=useState(false);
    const sc=lead.lead_quality_score||0;const isAdmin=user?.role==="admin";
    const[fin,setFin]=useState(null);// financials from /api/leads/:id/financials
    const hasContract=fin?.has_contract||false;
    const dealVal=hasContract?fin.contract_value:null;
    const hasCommission=hasContract&&fin?.commission_amount>0;
    const commission=hasCommission?fin.commission_amount:null;
    const noteRef=useRef(null);const panelRef=useRef(null);

    useEffect(()=>{loadExtra();setActionLogged(false);setPendingAction(null);setShowNextLead(false);setFin(null)},[lead.id]);
    const loadExtra=async()=>{
        try{
            const calls=[af(`/api/leads/${lead.id}/timeline`),af(`/api/tasks?lead_id=${lead.id}`),af(`/api/appointments?lead_id=${lead.id}`)];
            if(isAdmin)calls.push(af(`/api/admin/lead-lock/${lead.id}`));
            const[tr,tskr,ar,lr]=await Promise.all(calls);
            if(tr.ok)sTL(await tr.json());
            if(tskr.ok){const d=await tskr.json();sTasks(Array.isArray(d)?d:(d.items||[]))}
            if(ar.ok){const d=await ar.json();sAppts((Array.isArray(d)?d:[]).filter(a=>a.lead_id===lead.id))}
            if(lr&&lr.ok)sLock(await lr.json());
        }catch{}
        try{const lb=await af("/api/admin/leaderboard");if(lb.ok)setLB(await lb.json())}catch{}
        // Load real financials (project + commission)
        try{const fr=await af(`/api/leads/${lead.id}/financials`);if(fr.ok)setFin(await fr.json())}catch{}
    };

    // --- KEYBOARD SHORTCUTS ---
    useEffect(()=>{
        const handler=(e)=>{
            if(e.target.tagName==="INPUT"||e.target.tagName==="TEXTAREA"||e.target.tagName==="SELECT")return;
            if(e.key==="c"||e.key==="C"){if(lead.phone)window.open(`tel:${lead.phone}`)}
            if(e.key==="n"||e.key==="N"){setNoteType("general");setTimeout(()=>noteRef.current?.focus(),50)}
            if(e.key==="l"||e.key==="L"){setNoteType("call_log");setTimeout(()=>noteRef.current?.focus(),50)}
            if(e.key==="s"||e.key==="S"){setStatusDD(p=>!p);setOutcomeDD(false)}
            if(e.key==="o"||e.key==="O"){setOutcomeDD(p=>!p);setStatusDD(false)}
            if(e.key==="Escape"){if(statusDD){setStatusDD(false)}else if(outcomeDD){setOutcomeDD(false)}else if(assignDD){setAssignDD(false)}else{tryClose()}}
            if(e.key==="ArrowRight"||e.key==="]"){goNextLead(1)}
            if(e.key==="ArrowLeft"||e.key==="["){goNextLead(-1)}
        };
        window.addEventListener("keydown",handler);
        return()=>window.removeEventListener("keydown",handler);
    },[lead.id,statusDD,outcomeDD,assignDD,pendingAction]);

    // Navigate between leads
    const goNextLead=(dir)=>{
        if(!allLeads||allLeads.length<2)return;
        const idx=allLeads.findIndex(l=>l.id===lead.id);
        if(idx<0)return;
        const next=allLeads[(idx+dir+allLeads.length)%allLeads.length];
        if(next&&onNextLead)onNextLead(next);
    };

    // Suggest best next lead
    const suggestedNext=useMemo(()=>{
        if(!allLeads)return null;
        const candidates=allLeads.filter(l=>l.id!==lead.id&&!["closed_won","closed_lost"].includes(l.deal_status));
        // Priority: follow_up > appointed > confirmed > new
        const priority={follow_up:4,appointed:3,dispatched:3,confirmed:2,new:1};
        candidates.sort((a,b)=>(priority[b.deal_status]||0)-(priority[a.deal_status]||0)||(b.average_monthly_bill||0)-(a.average_monthly_bill||0));
        return candidates[0]||null;
    },[allLeads,lead.id]);

    // FORCE CLOSE GUARD: if pending action and note not logged, block close
    const tryClose=()=>{
        if(pendingAction&&!actionLogged){
            toast("err",`Log a note about: ${pendingAction.label}`);
            setTimeout(()=>noteRef.current?.focus(),100);
            return;
        }
        onClose();
    };

    // --- ACTIONS WITH FORCE LOG ---
    const updStatus=async(s)=>{try{const r=await af(`/api/leads/${lead.id}`,{method:"PUT",body:JSON.stringify({deal_status:s})});if(r.ok){toast("ok",sL(s));setStatusDD(false);setPendingAction({type:"status_change",label:`Status → ${sL(s)}`});setActionLogged(false);setNoteType("general");setTimeout(()=>noteRef.current?.focus(),200);onRefresh();loadExtra()}}catch{toast("err","Failed")}};
    const updOutcome=async(o)=>{try{const r=await af(`/api/leads/${lead.id}`,{method:"PUT",body:JSON.stringify({last_outcome:o})});if(r.ok){toast("ok",sL(o));setOutcomeDD(false);setPendingAction({type:"outcome_change",label:`Outcome → ${sL(o)}`});setActionLogged(false);setNoteType("general");setTimeout(()=>noteRef.current?.focus(),200);onRefresh();loadExtra()}}catch{toast("err","Failed")}};
    const assignRep=async(rid)=>{try{const r=await af(`/api/leads/${lead.id}/assign`,{method:"POST",body:JSON.stringify({rep_id:rid})});if(r.ok){toast("ok","Assigned");setAssignDD(false);onRefresh()}else{const d=await r.json().catch(()=>({}));toast("err",d.detail||"Failed")}}catch{toast("err","Failed")}};
    const completeTask=async(tid)=>{try{const r=await af(`/api/tasks/${tid}/complete`,{method:"POST",body:JSON.stringify({completion_notes:"Completed from lead panel"})});if(r.ok){toast("ok","Done");loadExtra()}}catch{toast("err","Failed")}};
    const deleteLead=async()=>{if(!confirm("Archive this lead?"))return;sDel(true);try{const r=await af(`/api/admin/leads/${lead.id}`,{method:"DELETE"});if(r.ok){toast("ok","Archived");onClose();onRefresh()}else{toast("err","Failed")}}catch{toast("err","Failed")}sDel(false)};
    const cancelAppt=async(aid)=>{if(!confirm("Cancel this appointment?"))return;try{const r=await af(`/api/admin/appointments/${aid}`,{method:"DELETE"});if(r.ok){toast("ok","Cancelled");loadExtra()}else{toast("err","Failed")}}catch{toast("err","Failed")}};
    const addNote=async()=>{if(!noteText.trim()){toast("err","Enter a note");return}setNB(true);try{const r=await af(`/api/leads/${lead.id}/notes`,{method:"POST",body:JSON.stringify({note:noteText,note_type:noteType})});if(r.ok){toast("ok",noteType==="call_log"?"Call logged":"Note added");setNote("");setActionLogged(true);setPendingAction(null);setShowNextLead(true);loadExtra()}else{toast("err","Failed")}}catch{toast("err","Failed")}setNB(false)};

    const rn=id=>{if(!id)return"--";const r=reps.find(x=>x.id===id);return r?r.full_name:`Rep #${id}`};
    const today=new Date().toISOString().split("T")[0];
    const now=Date.now();
    const allAppts=appts.sort((a,b)=>`${b.appointment_date}${b.appointment_time||""}`.localeCompare(`${a.appointment_date}${a.appointment_time||""}`));
    const nextAppt=appts.filter(a=>a.appointment_date>=today&&!["completed","cancelled","no_show"].includes(a.appointment_status)).sort((a,b)=>`${a.appointment_date}${a.appointment_time||""}`.localeCompare(`${b.appointment_date}${b.appointment_time||""}`))[0];
    const overdueTasks=tasks.filter(t=>t.lead_id===lead.id&&t.status==="overdue");
    const pendingTasks=tasks.filter(t=>t.lead_id===lead.id&&t.status==="pending");
    const fuTask=tasks.find(t=>t.lead_id===lead.id&&t.task_type==="follow_up"&&t.status!=="completed");
    const tlArr=Array.isArray(timeline)?timeline:(timeline?.timeline||[]);

    // ---- RISK ALERTS ----
    const risks=[];
    const lastActivity=tlArr.length>0?tlArr[0]:null;
    const hoursSinceActivity=lastActivity?.created_at?Math.round((now-new Date(lastActivity.created_at).getTime())/3600000):999;
    if(hoursSinceActivity>=18&&!["closed_won","closed_lost"].includes(lead.deal_status))risks.push({msg:`No activity in ${hoursSinceActivity}h`,color:"#ef4444",icon:IC.alert});
    if((lead.average_monthly_bill||0)>=300&&hoursSinceActivity>=12&&!["closed_won","closed_lost","appointed"].includes(lead.deal_status))risks.push({msg:"High-bill lead — act now",color:"#f59e0b",icon:IC.zap});
    if(fuTask&&fuTask.due_date&&fuTask.due_date<today)risks.push({msg:"Missed follow-up",color:"#ef4444",icon:IC.clock});
    if(overdueTasks.length>0)risks.push({msg:`${overdueTasks.length} overdue`,color:"#ef4444",icon:IC.alert});

    // ---- NEXT ACTION ENGINE ----
    let nextAction=null;
    if(!nextAppt&&!["closed_won","closed_lost"].includes(lead.deal_status)){
        nextAction={label:"NO APPOINTMENT SET",sub:"Set one now to keep this deal moving.",color:"#ef4444",icon:IC.cal,btn:"SET APPOINTMENT",act:()=>{onClose();onCreateAppt(lead)}};
    }else if(nextAppt){
        const[hh,mm]=(nextAppt.appointment_time||"00:00").split(":").map(Number);
        const apptMs=new Date(new Date(nextAppt.appointment_date).getFullYear(),new Date(nextAppt.appointment_date).getMonth(),new Date(nextAppt.appointment_date).getDate(),hh,mm).getTime();
        const minsAway=Math.round((apptMs-now)/60000);
        if(minsAway>0&&minsAway<=60){
            nextAction={label:`APPOINTMENT IN ${minsAway} MIN`,sub:`${$.t12(nextAppt.appointment_time)} — Prepare now`,color:"#f59e0b",icon:IC.clock,btn:"GO TO DISPATCH",act:()=>{onClose();nav("/dispatch")}};
        }else if(minsAway>60&&minsAway<=480){
            nextAction={label:`APPOINTMENT TODAY`,sub:`${$.t12(nextAppt.appointment_time)} — ${Math.round(minsAway/60)}h away`,color:"#3b82f6",icon:IC.cal,btn:"DISPATCH",act:()=>{onClose();nav("/dispatch")}};
        }
    }
    if(!nextAction&&overdueTasks.length>0){nextAction={label:"OVERDUE TASK",sub:overdueTasks[0].title,color:"#ef4444",icon:IC.alert,btn:"COMPLETE",act:()=>completeTask(overdueTasks[0].id)}}
    if(!nextAction&&fuTask){
        const fuHours=fuTask.due_date?Math.round((new Date(fuTask.due_date).getTime()-now)/3600000):0;
        nextAction={label:"FOLLOW-UP DUE",sub:`${fuTask.title} — ${fuHours<0?"OVERDUE":`Due ${$.date(fuTask.due_date)}`}`,color:"#3b82f6",icon:IC.phone,btn:"LOG CALL",act:()=>{setNoteType("call_log");setTimeout(()=>noteRef.current?.focus(),100)}};
    }
    if(!nextAction&&hoursSinceActivity>=8&&!["closed_won","closed_lost"].includes(lead.deal_status)){
        nextAction={label:"CALL BACK NOW",sub:`No contact in ${hoursSinceActivity}h`,color:"#f59e0b",icon:IC.phone,btn:"CALL",act:()=>{if(lead.phone)window.open(`tel:${lead.phone}`)}};
    }
    if(!nextAction&&["follow_up","appointed","dispatched","proposal_sent"].includes(lead.deal_status)){
        nextAction={label:"READY TO CLOSE",sub:hasContract?`${$.money(dealVal)} contract — push for commitment`:"Push for commitment",color:"#22c55e",icon:IC.zap,btn:"UPDATE STATUS",act:()=>setStatusDD(true)};
    }
    if(!nextAction&&!["closed_won","closed_lost"].includes(lead.deal_status)){
        nextAction={label:"ADD ACTIVITY",sub:"Keep this lead moving",color:"#52525b",icon:IC.edit,btn:"ADD NOTE",act:()=>{setNoteType("general");setTimeout(()=>noteRef.current?.focus(),100)}};
    }

    // ---- UNIFIED FEED ----
    const feed=useMemo(()=>{
        const f=[];
        tlArr.forEach(e=>{
            const aType=e.action_type||e.task_type||e.entry_type||"";
            const isNote=aType==="note"||aType==="call_log";
            const colorMap={note:"#3b82f6",call_log:"#22c55e",assigned:"#a855f7",status_change:"#f59e0b",created:"#3b82f6",completed:"#22c55e",en_route:"#a855f7",arrived:"#f59e0b",closed:"#22c55e",not_closed:"#ef4444",rescheduled:"#eab308",no_show:"#ef4444"};
            f.push({type:"timeline",ts:e.created_at,title:sL(aType),sub:e.note||e.description||e.title||"",who:e.rep_name,color:colorMap[aType]||(e.entry_type==="action"?"#f59e0b":"#3b82f6"),isNote});
        });
        appts.forEach(a=>f.push({type:"appt",ts:a.created_at||a.appointment_date,title:`Appt: ${sL(a.appointment_status)}`,sub:`${$.date(a.appointment_date)} ${$.t12(a.appointment_time)}${a.outcome?" — "+sL(a.outcome):""}`,color:"#a855f7",isNote:false}));
        pendingTasks.forEach(t=>f.push({type:"task",ts:t.created_at||t.due_date,title:t.title,sub:`${sL(t.task_type)} — due ${$.date(t.due_date)}`,color:"#3b82f6",taskId:t.id,status:t.status,isNote:false}));
        f.sort((a,b)=>(b.ts||"").localeCompare(a.ts||""));
        return f;
    },[tlArr,appts,pendingTasks]);

    // ---- LEADERBOARD RANK ----
    const rankPos=leaderboard?.leaderboard?.findIndex(r=>r.rep_id===user?.id);

    // Statuses and outcomes
    const statuses=["new","confirmed","appointed","dispatched","closed_won","closed_lost","follow_up","no_show","rehash"];
    const outcomes=["no_answer","lvm","follow_up","needs_reschedule","call_back","not_interested","not_home","sold","cancelled","just_show_up","same_day","disconnected","wrong_number"];
    const outcomeColors={no_answer:"#f59e0b",lvm:"#eab308",follow_up:"#3b82f6",needs_reschedule:"#a855f7",call_back:"#22c55e",not_interested:"#ef4444",not_home:"#f59e0b",sold:"#22c55e",cancelled:"#ef4444",just_show_up:"#22c55e",same_day:"#3b82f6",disconnected:"#ef4444",wrong_number:"#ef4444"};

    return(
        <><div className="dov" onClick={tryClose}/><div ref={panelRef} className="drw" style={{width:"min(100vw,900px)"}}>
            {/* ===== ACTIVE LEAD INDICATOR + HEADER ===== */}
            <div style={{background:"#f59e0b",height:3,width:"100%"}}/>
            <div style={{padding:"10px 20px",borderBottom:"1px solid #18181b",background:"#0a0a0c",position:"sticky",top:0,zIndex:2}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",gap:10}}>
                    <div style={{flex:1,minWidth:0}}>
                        <div style={{display:"flex",alignItems:"center",gap:8}}>
                            <div style={{width:8,height:8,borderRadius:"50%",background:"#f59e0b",animation:"sp 1.5s ease-in-out infinite",flexShrink:0}} title="Active Lead"/>
                            <h2 style={{fontSize:18,fontWeight:900,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{lead.first_name} {lead.last_name}</h2>
                            <span className={`badge ${sB(lead.deal_status)}`} style={{fontSize:11,padding:"3px 10px",cursor:"pointer",flexShrink:0}} onClick={()=>{setStatusDD(!statusDD);setOutcomeDD(false)}}>{sL(lead.deal_status)} &#x25BE;</span>
                            <span className="badge" style={{fontSize:10,cursor:"pointer",flexShrink:0,background:(outcomeColors[lead.last_outcome]||"#52525b")+"18",color:outcomeColors[lead.last_outcome]||"#52525b"}} onClick={()=>{setOutcomeDD(!outcomeDD);setStatusDD(false)}}>{lead.last_outcome?sL(lead.last_outcome):"Outcome"} &#x25BE;</span>
                        </div>
                        <div style={{fontSize:10,color:"#3f3f46",marginTop:2,display:"flex",gap:10,flexWrap:"wrap"}}>
                            <span>{lead.property_address||"--"}{lead.city?`, ${lead.city}`:""}</span>
                            {lead.average_monthly_bill&&<span style={{color:"#f59e0b",fontWeight:700}}>{$.money(lead.average_monthly_bill)}/mo</span>}
                            {hasContract?<span style={{color:"#22c55e",fontWeight:700}}>{$.money(dealVal)} contract</span>:fin===null?"":<span style={{color:"#3f3f46",fontSize:9}}>No contract</span>}
                            <span style={{color:"#3f3f46",fontSize:9}}>C: call &middot; N: note &middot; S: status &middot; O: outcome &middot; []: nav</span>
                        </div>
                    </div>
                    <div style={{display:"flex",gap:4,alignItems:"center",flexShrink:0}}>
                        {/* PREV/NEXT LEAD ARROWS */}
                        <button className="btn" style={{padding:"8px",minHeight:40,minWidth:32}} onClick={()=>goNextLead(-1)} title="Previous lead ["><Ic d="M15 18l-6-6 6-6" s={16}/></button>
                        {lead.phone&&<a href={`tel:${lead.phone}`} style={{textDecoration:"none"}}><button className="btn btn-g" style={{padding:"10px 18px",fontSize:14,fontWeight:900,display:"flex",alignItems:"center",gap:5,minHeight:44}}><Ic d={IC.phone} s={16} c="#22c55e"/>CALL</button></a>}
                        {isAdmin&&<button className="btn" style={{padding:"8px 14px",minHeight:40,fontSize:11,fontWeight:800,display:"flex",alignItems:"center",gap:4,border:assignDD?"1px solid #f59e0b":"1px solid #27272a",color:assignDD?"#f59e0b":"#a1a1aa"}} onClick={()=>{setAssignDD(!assignDD);setStatusDD(false);setOutcomeDD(false)}} title="Assign rep"><Ic d={IC.users} s={14} c={assignDD?"#f59e0b":"#a1a1aa"}/>{rn(lead.assigned_rep_id)!=="--"?rn(lead.assigned_rep_id):"ASSIGN"}</button>}
                        <button className="btn" style={{padding:"8px",minHeight:40,minWidth:32}} onClick={()=>goNextLead(1)} title="Next lead ]"><Ic d="M9 18l6-6-6-6" s={16}/></button>
                        <div style={{cursor:"pointer",padding:6}} onClick={tryClose}><Ic d={IC.x} s={18}/></div>
                    </div>
                </div>
                {/* INLINE STATUS DROPDOWN */}
                {statusDD&&<div style={{position:"absolute",top:"100%",left:20,background:"#111113",border:"1px solid #27272a",borderRadius:8,padding:6,zIndex:10,display:"flex",flexWrap:"wrap",gap:3,maxWidth:400,boxShadow:"0 8px 30px #00000080"}}>
                    {statuses.map(s=><button key={s} className={`btn ${lead.deal_status===s?"btn-p":""}`} style={{fontSize:10,padding:"5px 10px"}} disabled={lead.deal_status===s} onClick={()=>updStatus(s)}>{sL(s)}</button>)}
                </div>}
                {/* INLINE OUTCOME DROPDOWN */}
                {outcomeDD&&<div style={{position:"absolute",top:"100%",left:180,background:"#111113",border:"1px solid #27272a",borderRadius:8,padding:6,zIndex:10,display:"flex",flexWrap:"wrap",gap:3,maxWidth:380,boxShadow:"0 8px 30px #00000080"}}>
                    {outcomes.map(o=><button key={o} className="btn" style={{fontSize:10,padding:"5px 10px",color:outcomeColors[o]||"#a1a1aa",borderColor:(outcomeColors[o]||"#27272a")+"40"}} onClick={()=>updOutcome(o)}>{sL(o)}</button>)}
                </div>}
                {/* INLINE ASSIGN DROPDOWN */}
                {assignDD&&isAdmin&&<div style={{position:"absolute",top:"100%",right:20,background:"#111113",border:"1px solid #f59e0b40",borderRadius:10,padding:10,zIndex:20,maxHeight:360,overflowY:"auto",width:300,boxShadow:"0 12px 40px #000000cc"}}>
                    <div style={{fontSize:10,fontWeight:700,color:"#f59e0b",textTransform:"uppercase",letterSpacing:".06em",padding:"4px 8px 10px",borderBottom:"1px solid #1e1e1e",marginBottom:6}}>Assign Rep to {lead.first_name}</div>
                    {reps.length===0?<div style={{padding:"24px 8px",textAlign:"center"}}><div style={{color:"#71717a",fontSize:13,marginBottom:8}}>No active reps found.</div><div style={{color:"#52525b",fontSize:11}}>Invite reps from the Reps page first.</div></div>:
                    reps.map(r=>{const isCurrent=lead.assigned_rep_id===r.id;const displayName=r.full_name||r.name||r.email||"Unknown Rep";return<div key={r.id} style={{padding:"12px 14px",cursor:"pointer",fontSize:14,fontWeight:700,borderRadius:8,background:isCurrent?"#f59e0b18":"#18181b",display:"flex",justifyContent:"space-between",alignItems:"center",transition:"all .15s",borderLeft:isCurrent?"3px solid #f59e0b":"3px solid transparent",marginBottom:4,color:isCurrent?"#f59e0b":"#e4e4e7"}} onMouseEnter={e=>{if(!isCurrent){e.currentTarget.style.background="#27272a";e.currentTarget.style.borderLeftColor="#52525b"}}} onMouseLeave={e=>{if(!isCurrent){e.currentTarget.style.background="#18181b";e.currentTarget.style.borderLeftColor="transparent"}}} onClick={()=>assignRep(r.id)}>
                        <div style={{minWidth:0,flex:1}}><div style={{whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{displayName}</div><div style={{fontSize:10,color:"#52525b",marginTop:2}}>{r.email||""}{r.territory?` · ${r.territory}`:""}</div></div>
                        {isCurrent?<span className="badge b-orange" style={{fontSize:9,marginLeft:8,flexShrink:0}}>CURRENT</span>:<span style={{fontSize:10,color:"#52525b",marginLeft:8,flexShrink:0}}>Select</span>}
                    </div>})}
                </div>}
            </div>

            {/* ===== FORCE ACTION LOG BANNER ===== */}
            {pendingAction&&!actionLogged&&<div style={{background:"#ef444420",borderBottom:"2px solid #ef4444",padding:"10px 20px",display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                    <Ic d={IC.alert} s={16} c="#ef4444"/>
                    <div><div style={{fontSize:12,fontWeight:800,color:"#ef4444"}}>ACTION REQUIRED</div><div style={{fontSize:11,color:"#fca5a5"}}>Log a note about: {pendingAction.label}</div></div>
                </div>
                <button className="btn btn-p" style={{padding:"6px 14px",fontSize:11}} onClick={()=>{setNoteType("general");setTimeout(()=>noteRef.current?.focus(),50)}}>LOG NOW</button>
            </div>}

            {/* ===== TWO PANEL LAYOUT ===== */}
            <div style={{display:"flex",height:pendingAction&&!actionLogged?"calc(100vh - 140px)":"calc(100vh - 93px)",overflow:"hidden"}}>
                {/* ===== LEFT PANEL — COMPACT INFO ===== */}
                <div className="drw-left" style={{width:260,flexShrink:0,borderRight:"1px solid #18181b",overflowY:"auto",padding:"12px 14px",display:"flex",flexDirection:"column",gap:10}}>
                    {/* Lead Info */}
                    <div style={{display:"flex",flexDirection:"column",gap:6}}>
                        {lead.phone&&<a href={`tel:${lead.phone}`} style={{textDecoration:"none"}}><button className="btn btn-g" style={{width:"100%",padding:"12px",fontSize:14,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center",gap:8,minHeight:48}}><Ic d={IC.phone} s={18} c="#22c55e"/>CALL {lead.phone}</button></a>}
                        {lead.property_address&&<a href={`https://maps.google.com/?q=${encodeURIComponent((lead.property_address||"")+" "+(lead.city||"")+" "+(lead.state||""))}`} target="_blank" rel="noopener" style={{fontSize:11,color:"#3b82f6",textDecoration:"none",display:"block",padding:"4px 0"}}><Ic d={IC.map} s={11} c="#3b82f6"/> {lead.property_address}, {lead.city}</a>}
                    </div>

                    {/* Key Metrics */}
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                        <div style={{background:"#f59e0b08",border:"1px solid #f59e0b20",borderRadius:6,padding:8,textAlign:"center"}}><div style={{fontSize:16,fontWeight:900,color:"#f59e0b"}}>{lead.average_monthly_bill?$.money(lead.average_monthly_bill):"--"}</div><div style={{fontSize:8,color:"#52525b",fontWeight:800}}>MONTHLY BILL</div></div>
                        <div style={{background:hasContract?"#22c55e08":"#18181b",border:"1px solid "+(hasContract?"#22c55e20":"#27272a"),borderRadius:6,padding:8,textAlign:"center"}}><div style={{fontSize:hasCommission?16:10,fontWeight:900,color:hasCommission?"#22c55e":"#3f3f46"}}>{hasCommission?$.money(commission):hasContract?`${$.money(dealVal)} (no rate)`:"--"}</div><div style={{fontSize:8,color:"#52525b",fontWeight:800}}>{hasCommission?`COMMISSION (${fin?.commission_rate||""}%)`:"COMMISSION"}</div></div>
                    </div>

                    {/* Appointment */}
                    {nextAppt&&<div style={{background:"#3b82f610",border:"1px solid #3b82f630",borderRadius:6,padding:8}}>
                        <div style={{fontSize:9,fontWeight:800,color:"#3b82f6",textTransform:"uppercase"}}>Next Appt</div>
                        <div style={{fontSize:13,fontWeight:800,marginTop:2}}>{$.date(nextAppt.appointment_date)} {$.t12(nextAppt.appointment_time)}</div>
                        <div style={{fontSize:10,color:"#71717a"}}>{sL(nextAppt.appointment_status)}</div>
                    </div>}

                    {/* Quick Actions */}
                    <div style={{display:"flex",flexDirection:"column",gap:3}}>
                        <button className="btn btn-p" style={{width:"100%",padding:8,fontSize:11,fontWeight:800}} onClick={()=>{setNoteType("general");setTimeout(()=>noteRef.current?.focus(),50)}}><Ic d={IC.edit} s={12}/> ADD NOTE (N)</button>
                        <button className="btn" style={{width:"100%",padding:8,fontSize:11,fontWeight:800}} onClick={()=>{setNoteType("call_log");setTimeout(()=>noteRef.current?.focus(),50)}}><Ic d={IC.message} s={12}/> LOG CALL (L)</button>
                        <button className="btn" style={{width:"100%",padding:8,fontSize:11,fontWeight:800,color:"#f59e0b"}} onClick={()=>setStatusDD(true)}><Ic d={IC.flag} s={12} c="#f59e0b"/> STATUS (S)</button>
                        <button className="btn" style={{width:"100%",padding:8,fontSize:11,fontWeight:800,color:"#a855f7"}} onClick={()=>{onClose();onCreateAppt(lead)}}><Ic d={IC.cal} s={12} c="#a855f7"/> APPOINTMENT</button>
                        {isAdmin&&<button className="btn" style={{width:"100%",padding:8,fontSize:11,fontWeight:800}} onClick={()=>{setAssignDD(!assignDD);setStatusDD(false);setOutcomeDD(false)}}><Ic d={IC.users} s={12}/> ASSIGN</button>}
                    </div>

                    {/* Team */}
                    <div style={{fontSize:10}}>
                        <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}><span style={{color:"#3f3f46"}}>Assigned</span><span style={{fontWeight:700,color:"#a1a1aa"}}>{rn(lead.assigned_rep_id)}</span></div>
                        <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}><span style={{color:"#3f3f46"}}>Setter</span><span style={{color:"#52525b"}}>{rn(lead.setter_id)}</span></div>
                        <div style={{display:"flex",justifyContent:"space-between",marginBottom:2}}><span style={{color:"#3f3f46"}}>Closer</span><span style={{color:"#52525b"}}>{rn(lead.closer_id)}</span></div>
                    </div>

                    {/* Leaderboard rank */}
                    {rankPos!=null&&rankPos>=0&&<div style={{background:"#18181b",borderRadius:6,padding:8,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                        <span style={{fontSize:10,color:"#52525b"}}>Your Rank</span>
                        <span style={{fontSize:16,fontWeight:900,color:rankPos<3?"#f59e0b":"#71717a"}}>#{rankPos+1}</span>
                    </div>}

                    {/* Admin */}
                    {isAdmin&&<div>
                        <button className="btn" style={{width:"100%",fontSize:9,color:"#3f3f46"}} onClick={()=>setShowAdmin(!showAdmin)}>Admin {showAdmin?"▲":"▼"}</button>
                        {showAdmin&&<div style={{marginTop:4,display:"flex",flexDirection:"column",gap:3}}>
                            {appts.filter(a=>!["completed","cancelled"].includes(a.appointment_status)).map(a=><button key={a.id} className="btn btn-r" style={{fontSize:9,width:"100%"}} onClick={()=>cancelAppt(a.id)}>Cancel {$.date(a.appointment_date)}</button>)}
                            <button className="btn" style={{fontSize:9,color:"#ef4444",width:"100%"}} disabled={deleting} onClick={deleteLead}>{deleting?"...":"Archive"}</button>
                        </div>}
                    </div>}
                </div>

                {/* ===== RIGHT PANEL — EXECUTION AREA ===== */}
                <div style={{flex:1,overflowY:"auto",display:"flex",flexDirection:"column"}}>
                    {/* ===== NEXT MOVE — THE MOST VISIBLE ELEMENT ===== */}
                    {nextAction&&<div style={{padding:"14px 20px",borderBottom:"2px solid "+nextAction.color,background:nextAction.color+"08"}}>
                        <div style={{display:"flex",alignItems:"center",gap:16,cursor:"pointer"}} onClick={nextAction.act}>
                            <div style={{width:52,height:52,borderRadius:12,background:nextAction.color+"25",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,border:`2px solid ${nextAction.color}`}}><Ic d={nextAction.icon} s={26} c={nextAction.color}/></div>
                            <div style={{flex:1}}>
                                <div style={{fontSize:10,fontWeight:900,color:nextAction.color,textTransform:"uppercase",letterSpacing:".12em"}}>NEXT MOVE</div>
                                <div style={{fontSize:18,fontWeight:900,color:"#e4e4e7",lineHeight:1.2}}>{nextAction.label}</div>
                                <div style={{fontSize:12,color:"#a1a1aa",marginTop:2}}>{nextAction.sub}</div>
                            </div>
                            <button className="btn btn-p" style={{padding:"12px 24px",fontSize:14,fontWeight:900,flexShrink:0,minHeight:48}}>{nextAction.btn}</button>
                        </div>
                    </div>}

                    {/* RISK ALERTS */}
                    {risks.length>0&&<div style={{padding:"6px 20px",borderBottom:"1px solid #18181b",display:"flex",gap:6,flexWrap:"wrap"}}>
                        {risks.map((r,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:4,background:r.color+"10",border:`1px solid ${r.color}30`,borderRadius:5,padding:"4px 8px",fontSize:10,fontWeight:700,color:r.color}}><Ic d={r.icon} s={10} c={r.color}/>{r.msg}</div>)}
                    </div>}

                    {/* OVERDUE TASKS */}
                    {overdueTasks.length>0&&<div style={{padding:"8px 20px",borderBottom:"1px solid #18181b"}}>
                        <div style={{background:"#ef444410",border:"1px solid #ef444440",borderRadius:6,padding:8}}>
                            {overdueTasks.slice(0,3).map(t=><div key={t.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"3px 0"}}>
                                <span style={{fontSize:11,fontWeight:700,color:"#fca5a5"}}>{t.title} — due {$.date(t.due_date)}</span>
                                <button className="btn btn-p" style={{padding:"3px 10px",fontSize:10}} onClick={()=>completeTask(t.id)}>DONE</button>
                            </div>)}
                        </div>
                    </div>}

                    {/* ===== NOTE INPUT — DOMINANT, ALWAYS VISIBLE ===== */}
                    <div style={{padding:"12px 20px",borderBottom:"2px solid #27272a",background:"#0c0c0f"}}>
                        <div style={{display:"flex",gap:4,marginBottom:6}}>
                            <button className={`btn ${noteType==="general"?"btn-p":""}`} style={{fontSize:10,padding:"3px 10px"}} onClick={()=>setNoteType("general")}>Note</button>
                            <button className={`btn ${noteType==="call_log"?"btn-p":""}`} style={{fontSize:10,padding:"3px 10px"}} onClick={()=>setNoteType("call_log")}>Call Log</button>
                            {pendingAction&&!actionLogged&&<span style={{fontSize:10,color:"#ef4444",fontWeight:700,marginLeft:8,display:"flex",alignItems:"center",gap:3}}><Ic d={IC.alert} s={10} c="#ef4444"/>Required: log what happened</span>}
                        </div>
                        <div style={{display:"flex",gap:6}}>
                            <textarea ref={noteRef} className="inp" style={{flex:1,minHeight:44,maxHeight:120,fontSize:13}} value={noteText} onChange={e=>setNote(e.target.value)} placeholder={pendingAction?"What happened? (required before closing)...":noteType==="call_log"?"What was discussed...":"Note about this lead..."} onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey&&noteText.trim()){e.preventDefault();addNote()}}}/>
                            <button className="btn btn-p" style={{padding:"10px 20px",fontSize:13,fontWeight:800,alignSelf:"flex-end",minHeight:44}} disabled={notesBusy||!noteText.trim()} onClick={addNote}>{notesBusy?<div className="spin" style={{width:16,height:16,borderWidth:2}}/>:"SAVE"}</button>
                        </div>
                    </div>

                    {/* ===== NEXT LEAD SUGGESTION (after action logged) ===== */}
                    {showNextLead&&suggestedNext&&<div style={{padding:"10px 20px",borderBottom:"1px solid #18181b",background:"#f59e0b08"}}>
                        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                            <div>
                                <div style={{fontSize:9,fontWeight:800,color:"#f59e0b",textTransform:"uppercase"}}>Next Best Lead</div>
                                <div style={{fontSize:13,fontWeight:800}}>{suggestedNext.first_name} {suggestedNext.last_name} {suggestedNext.average_monthly_bill&&<span style={{color:"#f59e0b",fontSize:11}}>{$.money(suggestedNext.average_monthly_bill)}/mo</span>} <span className={`badge ${sB(suggestedNext.deal_status)}`} style={{fontSize:9}}>{sL(suggestedNext.deal_status)}</span></div>
                            </div>
                            <div style={{display:"flex",gap:4}}>

    );

// ===== ADDRESS AUTOCOMPLETE (Google Places) =====
const _gMapsLoaded={v:false,loading:false,key:""};
function loadGMaps(cb){
    if(_gMapsLoaded.v){cb();return}
    if(_gMapsLoaded.loading){const iv=setInterval(()=>{if(_gMapsLoaded.v){clearInterval(iv);cb()}},200);return}
    _gMapsLoaded.loading=true;
    fetch("/api/config/public").then(r=>r.json()).then(d=>{
        const k=d.google_maps_api_key;_gMapsLoaded.key=k;
        if(!k){_gMapsLoaded.loading=false;return}
        const s=document.createElement("script");
        s.src=`https://maps.googleapis.com/maps/api/js?key=${k}&libraries=places`;
        s.onload=()=>{_gMapsLoaded.v=true;_gMapsLoaded.loading=false;cb()};
        s.onerror=()=>{_gMapsLoaded.loading=false};
        document.head.appendChild(s);
    }).catch(()=>{_gMapsLoaded.loading=false});
}
function AddressInput({value,onChange,onSelect,placeholder,className}){
    const ref=useRef(null);const acRef=useRef(null);
    useEffect(()=>{
        loadGMaps(()=>{
            if(!ref.current||acRef.current||!window.google?.maps?.places)return;
            const ac=new window.google.maps.places.Autocomplete(ref.current,{types:["address"],componentRestrictions:{country:"us"}});
            ac.addListener("place_changed",()=>{
                const p=ac.getPlace();if(!p.address_components)return;
                const get=(t)=>{const c=p.address_components.find(x=>x.types.includes(t));return c?c.short_name||c.long_name:""};
                const street=`${get("street_number")} ${get("route")}`.trim();
                const city=get("locality")||get("sublocality_level_1")||get("administrative_area_level_2");
                const state=get("administrative_area_level_1");
                const zip=get("postal_code");
                const lat=p.geometry?.location?.lat();const lng=p.geometry?.location?.lng();
                if(onSelect)onSelect({address:street,city,state,zip,lat,lng,formatted:p.formatted_address||street});
                if(onChange)onChange(street);
            });
            acRef.current=ac;
        });
    },[]);
    return<input ref={ref} className={className||"inp"} value={value} onChange={e=>{if(onChange)onChange(e.target.value)}} placeholder={placeholder||"Start typing address..."} autoComplete="off"/>;
}

                    {!typeFilter&&<select className="inp" style={{minWidth:100}} value={typeFilter} onChange={e=>setTF(e.target.value)}><option value="">Task Type: All</option>{taskTypes.map(t=><option key={t} value={t}>{sL(t)}</option>)}</select>}
                    {user?.role==="admin"&&reps.length>0&&<select className="inp" style={{minWidth:100}} value={repFilter} onChange={e=>setRepFilter(e.target.value)}><option value="">Assigned To: All</option>{reps.map(r=><option key={r.id} value={r.id}>{r.full_name}</option>)}</select>}

                <div className="cd" style={{overflow:"hidden"}}>
                    <div style={{display:"grid",gridTemplateColumns:"2fr 1.5fr .8fr .8fr .5fr",padding:"8px 14px",borderBottom:"1px solid #18181b",fontSize:10,fontWeight:800,color:"#3f3f46",textTransform:"uppercase",letterSpacing:".06em"}}><div>Task</div><div>Lead</div><div>Due</div><div>Status</div><div/></div>
                    {tasks.map(t=>(
                        <div key={t.id} className="tr" style={{gridTemplateColumns:"2fr 1.5fr .8fr .8fr .5fr",display:"grid"}}>

                            <div>{t.status!=="completed"&&<button className="btn btn-g" style={{fontSize:9,padding:"2px 6px"}} onClick={()=>complete(t.id)}>Done</button>}</div>

                    ))}
                </div>}
            </div>
        </div>
    );
}

// ========================================================================
// PIPELINE (LEAD STATUS KANBAN)
// ========================================================================
function PipelinePage(){
    const{af}=useA();const[leads,setLeads]=useState([]);const[appts,setAppts]=useState([]);const[loading,sLd]=useState(true);
    useEffect(()=>{load()},[]);
    const load=async()=>{sLd(true);try{
        const[lr,ar]=await Promise.all([af("/api/leads?limit=500"),af("/api/appointments")]);
        if(lr.ok){const d=await lr.json();setLeads(Array.isArray(d)?d:(d.items||[]))}
        if(ar.ok){const d=await ar.json();setAppts(Array.isArray(d)?d:[])}
    }catch{}sLd(false)};

    // Real operational stages
    const stages=[
        {k:"submitted",l:"Submitted",c:"#71717a",desc:"TM/Canvasser submitted"},
        {k:"confirming",l:"Confirmation",c:"#eab308",desc:"Being confirmed"},
        {k:"confirmed",l:"Confirmed",c:"#22c55e",desc:"Homeowner confirmed"},
        {k:"dispatch_ready",l:"Dispatch Ready",c:"#3b82f6",desc:"Needs rep assignment"},
        {k:"assigned",l:"Assigned",c:"#a855f7",desc:"Rep assigned"},
        {k:"en_route",l:"En Route",c:"#f59e0b",desc:"Rep traveling"},
        {k:"arrived",l:"Arrived",c:"#f59e0b",desc:"Rep on site"},
        {k:"completed",l:"Completed",c:"#52525b",desc:"Outcome pending"},
        {k:"follow_up",l:"Follow Up",c:"#3b82f6",desc:"Needs follow-up"},
        {k:"rehash",l:"Rehash",c:"#f59e0b",desc:"Second attempt"},
        {k:"closed_won",l:"Sold",c:"#22c55e",desc:"Deal closed"},
        {k:"dead",l:"Dead / DNC",c:"#ef4444",desc:"No longer viable"},
    ];

    // Map legacy statuses to real ones
    const statusMap={"new":"submitted","appointed":"assigned","dispatched":"en_route","closed_lost":"dead"};

    const grouped=useMemo(()=>{
        const g={};stages.forEach(s=>g[s.k]=[]);
        leads.forEach(l=>{
            let s=l.deal_status||"submitted";
            if(statusMap[s])s=statusMap[s];
            if(g[s])g[s].push(l);else g["submitted"].push(l);
        });
        return g;
    },[leads]);

    // Counts for KPI
    const total=leads.length;
    const active=leads.filter(l=>!["closed_won","closed_lost","dead"].includes(l.deal_status)).length;
    const won=leads.filter(l=>l.deal_status==="closed_won").length;

    if(loading)return<Spin/>;
    return(
        <div>
            <PH title="Operations Pipeline" sub="Real appointment flow — submitted → sold"/>
            <div style={{padding:"12px 24px",display:"flex",gap:8,flexWrap:"wrap",borderBottom:"1px solid #18181b"}}>
                <KPI l="Total" v={total}/><KPI l="Active" v={active} t="warn"/><KPI l="Won" v={won} t="ok"/>
            </div>
            <div style={{padding:"14px 24px",overflowX:"auto"}}>
                <div style={{display:"flex",gap:8,minWidth:stages.length*160}}>
                    {stages.map(s=>{
                        const items=grouped[s.k]||[];
                        return(
                        <div key={s.k} style={{flex:1,minWidth:150}}>
                            <div style={{marginBottom:8,paddingBottom:6,borderBottom:`2px solid ${s.c}30`}}>
                                <div style={{display:"flex",alignItems:"center",gap:5}}>
                                    <div style={{width:7,height:7,borderRadius:"50%",background:s.c}}/>
                                    <span style={{fontSize:10,fontWeight:800,color:s.c,textTransform:"uppercase",letterSpacing:".04em"}}>{s.l}</span>
                                    <span style={{fontSize:10,color:"#3f3f46",marginLeft:"auto",fontWeight:700}}>{items.length}</span>
                                </div>
                                <div style={{fontSize:9,color:"#3f3f46",marginTop:2}}>{s.desc}</div>
                            </div>
                            <div style={{display:"flex",flexDirection:"column",gap:4,maxHeight:"60vh",overflowY:"auto"}}>
                                {items.slice(0,20).map(l=>(
                                    <div key={l.id} className="cd" style={{padding:8,borderLeft:`3px solid ${s.c}`,cursor:"pointer"}} onClick={()=>nav(`/leads?id=${l.id}`)}>
                                        <div style={{fontWeight:700,fontSize:11}}>{l.first_name} {l.last_name}</div>
                                        <div style={{fontSize:10,color:"#52525b"}}>{l.city||""}{l.state?`, ${l.state}`:""}</div>
                                        {l.average_monthly_bill&&<div style={{fontSize:11,fontWeight:700,marginTop:3,color:"#f59e0b"}}>{$.money(l.average_monthly_bill)}/mo</div>}
                                    </div>
                                ))}
                                {items.length>20&&<div style={{fontSize:9,color:"#3f3f46",textAlign:"center",padding:4}}>+{items.length-20} more</div>}
                                {items.length===0&&<div style={{padding:12,textAlign:"center",color:"#27272a",fontSize:9,border:"1px dashed #1e1e21",borderRadius:6}}>Empty</div>}
                            </div>
                        </div>
                    )})}
                </div>
            </div>
        </div>
    );
}

        sLd(true);
        try{
            const[kr,pr,rr]=await Promise.all([af("/api/projects/dashboard/summary"),af("/api/projects"),user?.role==="admin"?af("/api/admin/reps"):Promise.resolve(null)]);
            if(kr.ok)setKpis(await kr.json());

            if(rr&&rr.ok){const d=await rr.json();setReps(Array.isArray(d)?d:(d.reps||d.items||[]))}

    };

    const filtered=useMemo(()=>{

        if(repFilter)f=f.filter(p=>String(p.closer_id||p.assigned_rep_id)===repFilter||`${p.closer_name||""}`.toLowerCase().includes(reps.find(r=>String(r.id)===repFilter)?.full_name?.toLowerCase()||"___"));

        if(search)f=f.filter(p=>`${p.lead_name||""}`.toLowerCase().includes(search.toLowerCase()));

    },[projects,installFilter,fundingFilter,repFilter,dateFrom,dateTo,search]);

    const now=new Date();
    const getDaysInStage=(p)=>{if(!p.sold_date)return 0;return Math.floor((now-new Date(p.sold_date))/(1000*60*60*24))};
    const isDelayed=(p)=>getDaysInStage(p)>30;

    // Kanban grouping by install_status
    const kanbanStages=[{k:"pending_survey",l:"Survey",c:"#3b82f6"},{k:"pending_permit",l:"Permit",c:"#a855f7"},{k:"pending_install",l:"Install",c:"#f59e0b"},{k:"installed",l:"Installed",c:"#22c55e"},{k:"inspection",l:"Inspection",c:"#eab308"},{k:"pto",l:"PTO",c:"#3b82f6"},{k:"completed",l:"Done",c:"#22c55e"}];
    const kanbanGroups=useMemo(()=>{const g={};kanbanStages.forEach(s=>g[s.k]=[]);filtered.forEach(p=>{const s=p.install_status||"pending_survey";if(g[s])g[s].push(p);else g["pending_survey"]?.push(p)});return g},[filtered]);

                </div>

                    <KPI l="0-30 days" v={kData.aging_stats.by_age?.["0_30_days"]||0}/><KPI l="31-90 days" v={kData.aging_stats.by_age?.["31_90_days"]||0}/><KPI l="91-180 days" v={kData.aging_stats.by_age?.["91_180_days"]||0}/><KPI l="180+ days" v={kData.aging_stats.by_age?.["180_plus_days"]||0} t={(kData.aging_stats.by_age?.["180_plus_days"]||0)>0?"hot":null}/>
                </div>}

                    {reps.length>0&&<select className="inp" style={{minWidth:140}} value={repFilter} onChange={e=>setRepFilter(e.target.value)}><option value="">Closer: All</option>{reps.map(r=><option key={r.id} value={r.id}>{r.full_name}</option>)}</select>}
                    <input className="inp" type="date" style={{minWidth:120}} value={dateFrom} onChange={e=>setDateFrom(e.target.value)} title="Sold from"/>
