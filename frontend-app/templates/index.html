// ========================================================================
// MAP PAGE (FIELD DISPATCH + ALL LEADS VISUALIZATION)
// ========================================================================
function MapPage(){
    const{af,user}=useA();const toast=useT();
    const[appts,sAppts]=useState([]);const[leads,sLeads]=useState({});const[leadsArr,sLeadsArr]=useState([]);const[reps,sReps]=useState([]);const[loading,sLd]=useState(true);
    const[mapMode,setMode]=useState("appointments");const[mapFilter,setFilter]=useState("all");const[selAppt,setSelAppt]=useState(null);const[selLead,setSelLead]=useState(null);
    const[stats,setStats]=useState({total:0,withGeo:0,todayAppts:0,liveNow:0});
    const[showRoute,setShowRoute]=useState(false);
    const mapRef=useRef(null);const mapInstance=useRef(null);const refreshRef=useRef(null);const routeLineRef=useRef(null);

    useEffect(()=>{loadData();refreshRef.current=setInterval(()=>silentLoad(),30000);return()=>clearInterval(refreshRef.current)},[]);
    const silentLoad=async()=>{try{await loadData(false)}catch{}};
    const loadData=async(showSpin=true)=>{
        if(showSpin)sLd(true);
        try{
            const calls=[af("/api/appointments"),af("/api/leads?limit=500")];
            if(user?.role==="admin")calls.push(af("/api/admin/reps"));
            const results=await Promise.all(calls);
            if(results[0].ok){const d=await results[0].json();sAppts(Array.isArray(d)?d:[])}
            if(results[1].ok){const d=await results[1].json();const arr=Array.isArray(d)?d:(d.items||[]);const m={};arr.forEach(l=>m[l.id]=l);sLeads(m);sLeadsArr(arr);
                const withGeo=arr.filter(l=>l.geo_lat&&l.geo_lng).length;
                setStats(s=>({...s,total:arr.length,withGeo}))}
            if(results[2]&&results[2].ok){const d=await results[2].json();sReps(Array.isArray(d)?d:(d.reps||d.items||[]))}
        }catch{}
        if(showSpin)sLd(false);
    };

    // Map init — use callback ref pattern to init when DOM element appears
    const mapCbRef=useCallback(node=>{
        if(node&&!mapInstance.current&&typeof L!=="undefined"){
            mapRef.current=node;
            const m=L.map(node).setView([34.0,-118.0],7);
            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(m);
            mapInstance.current=m;
            // Ensure tiles render after layout settles
            setTimeout(()=>m.invalidateSize(),100);
        }
    },[]);
    // Cleanup on unmount only
    useEffect(()=>()=>{if(mapInstance.current){mapInstance.current.remove();mapInstance.current=null}},[]);

    useEffect(()=>{
        if(!mapInstance.current)return;
        // Clear existing markers and route lines
        mapInstance.current.eachLayer(l=>{if(l instanceof L.CircleMarker||l instanceof L.Marker||l instanceof L.Polyline)mapInstance.current.removeLayer(l)});
        const today=new Date().toISOString().split("T")[0];

        // Operational status colors
        const opColors={
            submitted:"#71717a",confirming:"#eab308",confirmed:"#22c55e",
            dispatch_ready:"#3b82f6",assigned:"#a855f7",en_route:"#f59e0b",
            arrived:"#f59e0b",completed:"#52525b",follow_up:"#3b82f6",
            rehash:"#eab308",closed_won:"#22c55e",dead:"#ef4444",
            new:"#3b82f6",closed_lost:"#ef4444",scheduled:"#eab308",
            no_show:"#ef4444",cancelled:"#ef4444",dispatched:"#a855f7",appointed:"#f59e0b"
        };

        if(mapMode==="appointments"){
            const allWithGeo=appts.filter(a=>{const l=leads[a.lead_id];return l?.geo_lat&&l?.geo_lng&&(mapFilter==="all"||a.appointment_status===mapFilter)});
            const todayOnly=allWithGeo.filter(a=>a.appointment_date===today);
            const liveNow=todayOnly.filter(a=>["en_route","arrived"].includes(a.appointment_status));
            const show=todayOnly.length>0?todayOnly:allWithGeo.slice(0,80);
            setStats(s=>({...s,todayAppts:todayOnly.length,liveNow:liveNow.length}));
            const bounds=[];
            // Sort by time for route line
            const sorted=[...show].sort((a,b)=>(a.appointment_time||"").localeCompare(b.appointment_time||""));
            sorted.forEach((a,idx)=>{
                const lead=leads[a.lead_id];
                const color=opColors[a.appointment_status]||"#999";
                const isLive=["en_route","arrived"].includes(a.appointment_status);
                const isToday=a.appointment_date===today;
                const radius=isLive?14:isToday?10:6;
                const marker=L.circleMarker([lead.geo_lat,lead.geo_lng],{
                    radius,fillColor:color,color:isLive?"#fff":"#27272a",
                    weight:isLive?3:1.5,opacity:1,fillOpacity:isLive?1:isToday?0.9:0.5
                });
                // Tooltip with name + time
                const name=`${lead.first_name} ${lead.last_name}`;
                const time=a.appointment_time?$.t12(a.appointment_time):"TBD";
                marker.bindTooltip(`<b>${name}</b><br>${sL(a.appointment_status)} · ${time}`,{className:"map-tip",direction:"top",offset:[0,-8]});
                marker.on("click",()=>setSelAppt(a));
                marker.addTo(mapInstance.current);
                bounds.push([lead.geo_lat,lead.geo_lng]);
            });
            // Draw route line for today's appointments
            if(showRoute&&todayOnly.length>1){
                const routeCoords=sorted.filter(a=>a.appointment_date===today).map(a=>{const l=leads[a.lead_id];return[l.geo_lat,l.geo_lng]});
                if(routeCoords.length>1){
                    L.polyline(routeCoords,{color:"#f59e0b",weight:2,opacity:0.5,dashArray:"8,8"}).addTo(mapInstance.current);
                }
            }
            if(bounds.length>1)mapInstance.current.fitBounds(bounds,{padding:[40,40]});
            else if(bounds.length===1)mapInstance.current.setView(bounds[0],12);
        } else {
            let filteredLeads=leadsArr.filter(l=>l.geo_lat&&l.geo_lng&&(mapFilter==="all"||mapFilter==="high_value"||l.deal_status===mapFilter));
            if(mapFilter==="high_value")filteredLeads=filteredLeads.filter(l=>(l.average_monthly_bill||0)>=250);
            const bounds=[];
            filteredLeads.forEach(l=>{
                const color=opColors[l.deal_status]||"#71717a";
                const bill=l.average_monthly_bill||0;
                const isHighVal=bill>=250;
                const radius=isHighVal?12:bill>=150?9:6;
                const marker=L.circleMarker([l.geo_lat,l.geo_lng],{
                    radius,fillColor:color,color:isHighVal?"#fbbf24":"#27272a",
                    weight:isHighVal?2.5:1,opacity:1,fillOpacity:isHighVal?0.95:0.8
                });
                marker.bindTooltip(`<b>${l.first_name} ${l.last_name}</b><br>${sL(l.deal_status)} · ${$.money(bill)}/mo`,{className:"map-tip",direction:"top",offset:[0,-8]});
                marker.on("click",()=>setSelLead(l));
                marker.addTo(mapInstance.current);
                bounds.push([l.geo_lat,l.geo_lng]);
            });
            if(bounds.length>1)mapInstance.current.fitBounds(bounds,{padding:[40,40]});
            else if(bounds.length===1)mapInstance.current.setView(bounds[0],12);
        }
    },[appts,leads,leadsArr,mapFilter,mapMode,showRoute]);

    if(loading)return<Spin/>;
    const apptStatuses=["all","scheduled","confirmed","en_route","arrived","completed"];
    const leadStatuses=["all","high_value","submitted","confirmed","dispatch_ready","assigned","follow_up","rehash","closed_won","dead"];
    const repsMap=reps.reduce((m,r)=>{m[r.id]=r;return m},{});

    return(
        <div style={{display:"flex",flexDirection:"column",height:"100vh"}}>
            <div style={{padding:"12px 24px",borderBottom:"1px solid #18181b",display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:8}}>
                <div><h1 style={{fontSize:18,fontWeight:900}}>Field Map</h1><div style={{fontSize:10,color:"#3f3f46"}}>{stats.withGeo} mapped · {stats.todayAppts} appts today · {stats.liveNow} live now · auto-refresh 30s</div></div>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                    <button className={`btn ${mapMode==="appointments"?"btn-p":""}`} onClick={()=>{setMode("appointments");setFilter("all")}}>Appointments</button>
                    <button className={`btn ${mapMode==="leads"?"btn-p":""}`} onClick={()=>{setMode("leads");setFilter("all")}}>Leads</button>
                    {mapMode==="appointments"&&<button className={`btn ${showRoute?"btn-p":""}`} onClick={()=>setShowRoute(p=>!p)} style={{fontSize:10}}>Route</button>}
                    <button className="btn" onClick={()=>loadData(true)}><Ic d={IC.refresh} s={12}/></button>
                </div>
            </div>
            <div style={{padding:"8px 24px",display:"flex",gap:4,flexWrap:"wrap",borderBottom:"1px solid #18181b"}}>
                {(mapMode==="appointments"?apptStatuses:leadStatuses).map(s=><button key={s} className={`btn ${mapFilter===s?"btn-p":""}`} style={{fontSize:10,padding:"4px 10px"}} onClick={()=>setFilter(s)}>{sL(s)}</button>)}
            </div>
            <div style={{flex:1,position:"relative"}}>
                <div ref={mapCbRef} style={{position:"absolute",inset:0,background:"#09090b"}}/>
                {/* Legend */}
                <div style={{position:"absolute",bottom:16,left:16,background:"#0c0c0fdd",border:"1px solid #27272a",borderRadius:8,padding:"8px 12px",zIndex:1000,fontSize:10}}>
                    {mapMode==="appointments"?
                        [{c:"#eab308",l:"Scheduled"},{c:"#22c55e",l:"Confirmed"},{c:"#3b82f6",l:"Dispatch Ready"},{c:"#a855f7",l:"Assigned"},{c:"#f59e0b",l:"En Route / Arrived"},{c:"#52525b",l:"Completed"}].map(x=>
                            <div key={x.l} style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}><div style={{width:8,height:8,borderRadius:"50%",background:x.c}}/><span style={{color:"#a1a1aa"}}>{x.l}</span></div>
                        ):
                        [{c:"#71717a",l:"Submitted"},{c:"#22c55e",l:"Confirmed/Won"},{c:"#3b82f6",l:"Dispatch Ready"},{c:"#a855f7",l:"Assigned"},{c:"#eab308",l:"Rehash"},{c:"#ef4444",l:"Dead"}].map(x=>
                            <div key={x.l} style={{display:"flex",alignItems:"center",gap:6,marginBottom:2}}><div style={{width:8,height:8,borderRadius:"50%",background:x.c}}/><span style={{color:"#a1a1aa"}}>{x.l}</span></div>
                        )
                    }
                </div>
                {/* Next best stop indicator */}
                {stats.liveNow>0&&<div style={{position:"absolute",top:16,right:16,background:"#052e16",border:"1px solid #166534",borderRadius:8,padding:"8px 12px",zIndex:1000,fontSize:11,color:"#22c55e",fontWeight:700}}>
                    {stats.liveNow} rep{stats.liveNow!==1?"s":""} live in field
                </div>}
            </div>
            {selAppt&&<MapPinDrawer appt={selAppt} lead={leads[selAppt.lead_id]} reps={reps} repsMap={repsMap} onClose={()=>setSelAppt(null)} onRefresh={()=>{setSelAppt(null);loadData(false)}} af={af} toast={toast} user={user}/>}
            {selLead&&<LeadDrawer lead={selLead} reps={reps} onClose={()=>setSelLead(null)} onRefresh={()=>loadData(false)} onCreateAppt={()=>{}}/>}
        </div>
    );
}

    const[showScript,setShowScript]=useState(null);const[showOutcome,setShowOutcome]=useState(null);
    const[fuDate,setFuDate]=useState("");const noteRef=useRef(null);

    useEffect(()=>{loadQueue()},[]);
    const loadQueue=async()=>{
        sLd(true);
        try{
            const r=await af("/api/confirmation/queue");
            if(r.ok){const d=await r.json();setQueue(Array.isArray(d)?d:[])}
        }catch{}
        sLd(false);
    };

    // Confirmation outcomes - real business flow
    const outcomes=[
        {k:"confirmed",l:"Confirmed",c:"#22c55e",icon:"✓",desc:"Homeowner confirmed. Moves to Dispatch Ready."},
        {k:"no_answer",l:"No Answer",c:"#f59e0b",icon:"📞",desc:"No pickup. Stays in queue."},
        {k:"voicemail",l:"Left Voicemail",c:"#eab308",icon:"📧",desc:"Left message. Stays in queue."},
        {k:"rescheduled",l:"Rescheduled",c:"#a855f7",icon:"📅",desc:"New date set. Requires follow-up date."},
        {k:"not_interested",l:"Not Interested",c:"#ef4444",icon:"✗",desc:"Moves to Rehash queue."},
        {k:"needs_time",l:"Needs Time",c:"#3b82f6",icon:"⏳",desc:"Moves to Rehash. Will circle back."},
        {k:"dnc",l:"Do Not Call",c:"#7f1d1d",icon:"🚫",desc:"Dead. Marked DNC permanently."},
        {k:"follow_up_later",l:"Follow Up Later",c:"#3b82f6",icon:"🔄",desc:"Stays in confirmation. Requires date."},
    ];

    const logAttempt=async(apptId,outcome)=>{
        if(!noteText.trim()&&outcome!=="no_answer"&&outcome!=="voicemail"){toast("err","Note required for this outcome");noteRef.current?.focus();return}
        if((outcome==="rescheduled"||outcome==="follow_up_later")&&!fuDate){toast("err","Follow-up date required");return}
        try{
            const body={outcome,notes:noteText.trim()||null,next_callback_date:fuDate||null};
            const r=await af(`/api/confirmation/${apptId}/attempt`,{method:"POST",body:JSON.stringify(body)});
            if(r.ok){
                toast("ok","Logged: "+sL(outcome));
                setNoteText("");setFuDate("");setShowOutcome(null);setActiveCard(null);
                loadQueue();
            }else{toast("err","Failed")}
        }catch{toast("err","Error")}
    };

    const scripts={
        confirmation:"Hi, this is [Agent] from Sunbull Solar. I'm calling to confirm your appointment on [DATE] at [TIME]. Will you be available? Great! Your solar consultant will be there. Please have a recent electric bill handy.",
        reschedule:"Hi, this is [Agent] from Sunbull Solar. We had an appointment for [DATE]. We need to find a new time. What day works best this week?",
        follow_up:"Hi, this is [Agent] from Sunbull Solar following up on your consultation. Any questions about the proposal? Our current promotion expires [DATE].",
        voicemail:"[VM] Hi, this is [Agent] from Sunbull Solar confirming your upcoming solar consultation. Please call us back at [NUMBER] or text CONFIRM.",
    };

    if(loading)return<Spin/>;

    const pending=queue.filter(q=>q.confirmation_status==="pending").length;
    const confirming=queue.filter(q=>q.confirmation_status==="confirming").length;
    const today=new Date().toISOString().split("T")[0];
    const todayQ=queue.filter(q=>q.appointment_date===today);
    const urgentQ=queue.filter(q=>{const d=q.appointment_date;return d&&d<=today});

    return(
        <div>
            <PH title="Confirmation Queue" sub={`${queue.length} appointments to confirm`} right={<div style={{display:"flex",gap:6}}>
                <button className="btn" onClick={()=>setShowScript("confirmation")}><Ic d={IC.message} s={12}/> Scripts</button>
                <button className="btn" onClick={loadQueue}><Ic d={IC.refresh} s={12}/></button>
            </div>}/>
            {/* KPI Bar */}
            <div style={{padding:"12px 24px",display:"flex",gap:8,flexWrap:"wrap",borderBottom:"1px solid #18181b"}}>
                <KPI l="Total Queue" v={queue.length} t={queue.length>0?"warn":null}/>
                <KPI l="New (Pending)" v={pending} t={pending>0?"hot":null}/>
                <KPI l="In Progress" v={confirming}/>
                <KPI l="Today's Appts" v={todayQ.length} t={todayQ.length>0?"warn":null}/>
                <KPI l="Urgent (Past Due)" v={urgentQ.length} t={urgentQ.length>0?"hot":null}/>
            </div>
            <div style={{padding:"16px 24px"}}>
                {queue.length===0?<div className="cd"><Empty icon={IC.check} title="Queue empty" sub="All caught up! New appointments will appear here for confirmation"/></div>:
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                    {/* Urgent first, then by date */}
                    {queue.sort((a,b)=>(a.appointment_date||"").localeCompare(b.appointment_date||"")||(a.appointment_time||"").localeCompare(b.appointment_time||"")).map(q=>{
                        const isActive=activeCard===q.appointment_id;
                        const isUrgent=q.appointment_date&&q.appointment_date<=today;
                        const isOverdue=q.confirmation_overdue||(q.created_at&&(Date.now()-new Date(q.created_at).getTime())>7200000&&q.confirmation_status==="pending");
                        const apptType=q.appointment_type||"in_person";
                        return(
                        <div key={q.appointment_id} className="cd" style={{padding:0,borderLeft:isUrgent?"3px solid #ef4444":isOverdue?"3px solid #ef4444":q.confirmation_status==="pending"?"3px solid #f59e0b":"3px solid #3b82f6",overflow:"hidden",background:isOverdue?"#ef444406":"transparent"}}>
                            {/* Overdue SLA banner */}
                            {isOverdue&&<div style={{background:"#ef444418",padding:"4px 16px",fontSize:10,fontWeight:800,color:"#ef4444",textTransform:"uppercase",letterSpacing:".04em",display:"flex",alignItems:"center",gap:6}}>⚠ CONFIRMATION OVERDUE — SLA BREACHED{q.confirmation_attempts_count>0?` (${q.confirmation_attempts_count} attempts)`:""}</div>}
                            {/* Main row - always visible */}
                            <div style={{padding:"12px 16px",display:"grid",gridTemplateColumns:"2.5fr 1.5fr 1fr 1fr 1.5fr .8fr",alignItems:"center",gap:8,cursor:"pointer"}} onClick={()=>setActiveCard(isActive?null:q.appointment_id)}>
                                <div>
                                    <div style={{fontWeight:700,fontSize:14,color:isOverdue?"#fca5a5":"#e4e4e7"}}>{q.first_name} {q.last_name}</div>
                                    <a href={`tel:${q.phone}`} style={{fontSize:12,color:"#3b82f6",textDecoration:"none"}} onClick={e=>e.stopPropagation()}><Ic d={IC.phone} s={10} c="#3b82f6"/> {q.phone}</a>
                                </div>
                                <div style={{fontSize:11,color:"#71717a"}}>{q.property_address}{q.city?`, ${q.city}`:""}</div>
                                <div>
                                    <div style={{fontSize:12,fontWeight:700,color:isUrgent?"#ef4444":"#e4e4e7"}}>{q.appointment_date}</div>
                                    <div style={{fontSize:11,color:"#71717a"}}>{q.appointment_time||"TBD"}</div>
                                </div>
                                <div>
                                    <span style={{fontSize:10,fontWeight:700,padding:"3px 8px",borderRadius:4,background:apptType==="zoom"?"#1e1b4b":"#1c1917",color:apptType==="zoom"?"#a78bfa":"#f59e0b",border:"1px solid "+(apptType==="zoom"?"#312e81":"#292524")}}>{apptType==="in_person"?"In Person":apptType==="zoom"?"Zoom":"Phone"}</span>
                                    {q.average_monthly_bill&&<div style={{fontSize:11,color:"#f59e0b",fontWeight:700,marginTop:2}}>{$.money(q.average_monthly_bill)}/mo</div>}
                                </div>
                                <div style={{fontSize:10,color:"#52525b"}}>
                                    {q.confirmation_attempts_count>0&&<span>{q.confirmation_attempts_count} attempt{q.confirmation_attempts_count!==1?"s":""}</span>}
                                    {q.submitted_by_name&&<div>via {q.submitted_by_name}</div>}
                                </div>
                                <div style={{textAlign:"right"}}>
                                    <span className={`badge ${q.confirmation_status==="pending"?"b-yellow":"b-blue"}`}>{sL(q.confirmation_status)}</span>
                                </div>
                            </div>
                            {/* Expanded detail panel */}
                            {isActive&&<div style={{borderTop:"1px solid #18181b",padding:"14px 16px",background:"#0a0a0c"}}>
                                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:14}}>
                                    {/* Left: homeowner detail + recording + summary */}
                                    <div>
                                        <SH title="Homeowner Details"/>
                                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6,marginBottom:10}}>
                                            <DF l="Phone" v={q.phone} c="#3b82f6"/>
                                            <DF l="Email" v={q.email||"--"}/>
                                            <DF l="Address" v={q.property_address}/>
                                            <DF l="Bill" v={q.average_monthly_bill?$.money(q.average_monthly_bill)+"/mo":"--"} c="#f59e0b"/>
                                        </div>
                                        {q.telemarketing_summary&&<div style={{background:"#111113",border:"1px solid #1e1e21",borderRadius:6,padding:10,marginBottom:8}}>
                                            <div style={{fontSize:9,fontWeight:800,color:"#52525b",textTransform:"uppercase",marginBottom:4}}>TM Summary</div>
                                            <div style={{fontSize:12,color:"#a1a1aa",lineHeight:1.5,whiteSpace:"pre-wrap"}}>{q.telemarketing_summary}</div>
                                        </div>}
                                        {q.recording_url&&<a href={q.recording_url} target="_blank" rel="noopener" style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:11,color:"#3b82f6",textDecoration:"none",marginBottom:8}}>🎙 Listen to Recording</a>}
                                        {q.notes&&<div style={{fontSize:11,color:"#71717a",marginTop:4}}>Notes: {q.notes}</div>}
                                    </div>
                                    {/* Right: confirmation action panel */}
                                    <div>
                                        <SH title="Log Confirmation Attempt"/>
                                        <div style={{marginBottom:8}}>
                                            <a href={`tel:${q.phone}`} style={{display:"block",textAlign:"center",background:"#052e16",border:"1px solid #166534",borderRadius:6,padding:"10px",color:"#22c55e",fontWeight:800,fontSize:13,textDecoration:"none",marginBottom:8}}>📞 CALL {q.phone}</a>
                                        </div>
                                        <textarea ref={noteRef} className="inp" placeholder="What happened on this call? (required for most outcomes)" value={noteText} onChange={e=>setNoteText(e.target.value)} style={{marginBottom:8,minHeight:60}}/>
                                        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4,marginBottom:8}}>
                                            {outcomes.map(o=>(
                                                <button key={o.k} className="btn" onClick={()=>{
                                                    if(o.k==="rescheduled"||o.k==="follow_up_later"){setShowOutcome(o.k)}else{logAttempt(q.appointment_id,o.k)}
                                                }} style={{padding:"8px 6px",fontSize:11,fontWeight:700,background:o.k==="confirmed"?"#052e16":o.k==="dnc"?"#450a0a":"transparent",borderColor:o.c,color:o.c}}>{o.icon} {o.l}</button>
                                            ))}
                                        </div>
                                        {/* Follow-up date picker for reschedule/follow_up_later */}
                                        {showOutcome&&<div style={{background:"#111113",border:"1px solid #27272a",borderRadius:6,padding:10,marginBottom:8}}>
                                            <div style={{fontSize:10,fontWeight:800,color:"#f59e0b",marginBottom:6}}>{showOutcome==="rescheduled"?"New Appointment Date":"Follow-Up Date"}</div>
                                            <input type="date" className="inp" value={fuDate} onChange={e=>setFuDate(e.target.value)} style={{marginBottom:6}}/>
                                            <div style={{display:"flex",gap:6}}>
                                                <button className="btn btn-p" style={{flex:1,padding:8,fontSize:11}} onClick={()=>logAttempt(q.appointment_id,showOutcome)}>Submit</button>
                                                <button className="btn" style={{padding:8,fontSize:11}} onClick={()=>setShowOutcome(null)}>Cancel</button>
                                            </div>
                                        </div>}
                                    </div>
                                </div>
                            </div>}
                        </div>
                    )})}
                </div>}
            </div>
            {/* Call Script Modal */}
            {showScript&&(
                <div className="modal-ov" onClick={()=>setShowScript(null)}><div className="modal" style={{width:520}} onClick={e=>e.stopPropagation()}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}>
                        <h3 style={{fontSize:16,fontWeight:800}}>Call Scripts</h3>
                        <div style={{cursor:"pointer"}} onClick={()=>setShowScript(null)}><Ic d={IC.x}/></div>
                    </div>
                    <div style={{display:"flex",gap:4,marginBottom:16,flexWrap:"wrap"}}>
                        {Object.keys(scripts).map(k=><button key={k} className={`btn ${showScript===k?"btn-p":""}`} onClick={()=>setShowScript(k)}>{sL(k)}</button>)}
                    </div>
                    <div style={{background:"#09090b",border:"1px solid #27272a",borderRadius:8,padding:16}}>
                        <div style={{fontSize:10,fontWeight:800,color:"#f59e0b",textTransform:"uppercase",marginBottom:8}}>{sL(showScript)} Script</div>
                        <div style={{fontSize:13,color:"#a1a1aa",lineHeight:1.6,whiteSpace:"pre-wrap"}}>{scripts[showScript]||"Select a script above."}</div>
                    </div>
                </div></div>
            )}
        </div>
    );
}

// ========================================================================
// SHARED COMPONENTS
// ========================================================================
function PH({title,sub,right}){return<div style={{padding:"20px 28px 16px",borderBottom:"1px solid #18181b",display:"flex",alignItems:"center",justifyContent:"space-between",gap:16}}><div><h1 className="ph-title" style={{fontSize:20,fontWeight:800,letterSpacing:"-.02em",lineHeight:1.2}}>{title}</h1>{sub&&<p style={{color:"#52525b",fontSize:12,marginTop:4,fontWeight:500}}>{sub}</p>}</div>{right&&<div style={{flexShrink:0}}>{right}</div>}</div>}
function KPI({l,v,t}){return<div className={`kpi ${t||""}`}><div style={{fontSize:9,fontWeight:700,color:"#52525b",textTransform:"uppercase",letterSpacing:".06em",marginBottom:4}}>{l}</div><div style={{fontSize:20,fontWeight:800,letterSpacing:"-.02em",color:t==="hot"?"#ef4444":t==="warn"?"#f59e0b":t==="ok"?"#22c55e":"#e4e4e7"}}>{v}</div></div>}
function SH({title,count}){return<div style={{display:"flex",alignItems:"center",gap:8,marginBottom:10}}><span style={{fontSize:11,fontWeight:700,color:"#52525b",textTransform:"uppercase",letterSpacing:".06em"}}>{title}</span>{count!=null&&<span className="badge b-gray" style={{fontSize:9}}>{count}</span>}</div>}
function DF({l,v,c}){return<div style={{marginBottom:2}}><div style={{fontSize:9,fontWeight:700,color:"#3f3f46",textTransform:"uppercase",letterSpacing:".05em",marginBottom:3}}>{l}</div><div style={{fontSize:13,fontWeight:600,color:c||"#a1a1aa"}}>{v||"--"}</div></div>}
function TaskRow({t,compact}){return<div style={{padding:compact?"7px 0":"10px 14px",borderBottom:"1px solid #18181b20",display:"flex",justifyContent:"space-between",alignItems:"center",transition:"background .1s"}}><div><div style={{fontSize:compact?11:12,fontWeight:600}}>{t.title}</div><div style={{fontSize:10,color:"#3f3f46",marginTop:2}}>Due {$.date(t.due_date)}</div></div><span className={`badge ${t.status==="overdue"?"b-red":"b-yellow"}`}>{sL(t.status)}</span></div>}
function Spin(){return<div style={{display:"flex",justifyContent:"center",padding:64}}><div className="spin"/></div>}
function Empty({icon,title,sub}){return<div className="empty-state"><Ic d={icon||IC.list} s={40} c="#27272a"/><div className="es-title">{title||"Nothing here yet"}</div>{sub&&<div className="es-sub">{sub}</div>}</div>}

// ========================================================================
// APP
// ========================================================================
function Shell(){
    const h=useH();const p=h.split("?")[0];
    const routes={"/dashboard":DashboardPage,"/dispatch":DispatchPage,"/leads":LeadsPage,"/reps":RepsPage,"/tasks":TasksPage,"/pipeline":PipelinePage,"/projects":ProjectsPage,"/map":MapPage,"/telemarketing":TelemarketingPage};
    const P=routes[p]||DashboardPage;
    return<div><Sidebar/><div className="mc page-fade" key={p}><P/></div></div>;
}

function App(){
    const{user,loading}=useA();
    if(loading)return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#09090b"}}><div className="spin"/></div>;
    if(!user)return<Login/>;
    return<Shell/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<AP><TP><App/></TP></AP>);
</script>
<style>.lbl{display:block;font-size:10px;font-weight:700;color:#52525b;margin-bottom:5px;text-transform:uppercase;letter-spacing:.06em}</style>
</body>
</html>
