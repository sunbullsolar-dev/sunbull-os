                        <div>Name</div><div>Location</div><div>Bill</div><div>Score</div><div>Status</div><div>Src</div>
                    </div>
                    {filtered.length===0&&<div style={{padding:32,textAlign:"center",color:"#3f3f46"}}>No leads</div>}
                    {filtered.map(l=>(
                        <div key={l.id} className="tr" style={{gridTemplateColumns:"2fr 1.2fr .8fr .7fr 1fr .5fr"}} onClick={()=>sSel(l)}>
                            <div><div style={{fontWeight:700,fontSize:13}}>{l.first_name} {l.last_name}</div>{l.phone&&<div style={{fontSize:10}}><a href={`tel:${l.phone}`} style={{color:"#52525b",textDecoration:"none"}} onClick={e=>e.stopPropagation()}>{l.phone}</a></div>}</div>
                            <div style={{fontSize:12,color:"#71717a"}}>{l.city}, {l.state}</div>
                            <div style={{fontWeight:700,color:"#f59e0b",fontSize:13}}>{$.money(l.average_monthly_bill)}</div>
                            <div>{l.lead_quality_score>0&&<span className="badge" style={{background:sC(l.lead_quality_score)+"18",color:sC(l.lead_quality_score)}}>{l.lead_quality_score}</span>}</div>
                            <div><span className={`badge ${sB(l.deal_status)}`}>{sL(l.deal_status)}</span></div>
                            <div style={{fontSize:10,color:"#3f3f46"}}>{sL(l.source_type)}</div>
                        </div>
                    ))}
                </div>
            </div>
            {sel&&<LeadDrawer lead={sel} reps={reps} onClose={()=>sSel(null)} onRefresh={loadLeads} onCreateAppt={setSCA}/>}
            {showCreate&&<CreateLeadModal onClose={()=>setSC(false)} onDone={()=>{setSC(false);loadLeads()}}/>}
            {showCreateAppt&&<CreateApptModal lead={showCreateAppt} reps={reps} onClose={()=>setSCA(null)} onDone={()=>{setSCA(null);loadLeads()}}/>}
        </div>
    );
}

// ===== LEAD DETAIL DRAWER (ALL TABS) =====
function LeadDrawer({lead,reps,onClose,onRefresh,onCreateAppt}){
    const{af,user}=useA();const toast=useT();
    const[tab,sTab]=useState("overview");const[timeline,sTL]=useState([]);const[tasks,sTasks]=useState([]);const[appts,sAppts]=useState([]);
    const[lockInfo,sLock]=useState(null);const[deleting,sDel]=useState(false);
    const sc=lead.lead_quality_score||0;

    useEffect(()=>{loadExtra()},[lead.id]);
    const loadExtra=async()=>{
        try{
            const calls=[af(`/api/leads/${lead.id}/timeline`),af(`/api/tasks?lead_id=${lead.id}`),af("/api/appointments")];
            if(user?.role==="admin")calls.push(af(`/api/admin/lead-lock/${lead.id}`));
            const[tr,tskr,ar,lr]=await Promise.all(calls);
            if(tr.ok)sTL(await tr.json());
            if(tskr.ok){const d=await tskr.json();sTasks(Array.isArray(d)?d:(d.items||[]))}
            if(ar.ok){const d=await ar.json();sAppts((Array.isArray(d)?d:[]).filter(a=>a.lead_id===lead.id))}
            if(lr&&lr.ok)sLock(await lr.json());
        }catch{}
    };

    const updStatus=async(s)=>{try{const r=await af(`/api/leads/${lead.id}`,{method:"PUT",body:JSON.stringify({deal_status:s})});if(r.ok){toast("ok",sL(s));onRefresh()}}catch{toast("err","Failed")}};
    const assignRep=async(rid)=>{try{const r=await af(`/api/leads/${lead.id}/assign`,{method:"POST",body:JSON.stringify({rep_id:rid})});if(r.ok){toast("ok","Assigned");onRefresh()}else{const d=await r.json().catch(()=>({}));toast("err",d.detail||"Failed")}}catch{toast("err","Failed")}};
    const completeTask=async(tid)=>{try{const r=await af(`/api/tasks/${tid}/complete`,{method:"POST",body:JSON.stringify({completion_notes:"Completed from lead drawer"})});if(r.ok){toast("ok","Done");loadExtra()}}catch{toast("err","Failed")}};
    const deleteLead=async()=>{if(!confirm("Archive this lead? This will soft-delete it."))return;sDel(true);try{const r=await af(`/api/admin/leads/${lead.id}`,{method:"DELETE"});if(r.ok){toast("ok","Lead archived");onClose();onRefresh()}else{const d=await r.json().catch(()=>({}));toast("err",d.detail||"Failed")}}catch{toast("err","Failed")}sDel(false)};
    const cancelAppt=async(aid)=>{if(!confirm("Cancel this appointment?"))return;try{const r=await af(`/api/admin/appointments/${aid}`,{method:"DELETE"});if(r.ok){toast("ok","Cancelled");loadExtra()}else{toast("err","Failed")}}catch{toast("err","Failed")}};

    const tabs=["overview","timeline","appointments","tasks","ownership","actions"];

    return(
        <><div className="dov" onClick={onClose}/><div className="drw">
            <div style={{padding:"16px 20px",borderBottom:"1px solid #18181b",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div>
                    <h2 style={{fontSize:17,fontWeight:900}}>{lead.first_name} {lead.last_name}</h2>
                    <div style={{display:"flex",gap:5,marginTop:5,flexWrap:"wrap"}}>
                        <span className="badge" style={{background:sC(sc)+"18",color:sC(sc)}}>{sc}pt</span>
                        <span className={`badge ${sB(lead.deal_status)}`}>{sL(lead.deal_status)}</span>
                        {lead.is_held&&<span className="badge b-green">Held</span>}
                        {lockInfo&&lockInfo.is_locked&&<span className="badge b-red">LOCKED ({lockInfo.open_task_count} tasks)</span>}
                    </div>
                </div>
                <div style={{cursor:"pointer",padding:6}} onClick={onClose}><Ic d={IC.x}/></div>
            </div>
            {/* Tabs */}
            <div style={{display:"flex",borderBottom:"1px solid #18181b",overflowX:"auto"}}>{tabs.map(t=><div key={t} className={`tab ${tab===t?"on":""}`} onClick={()=>sTab(t)}>{t}</div>)}</div>
            <div style={{padding:20}}>
                {/* OVERVIEW */}
                {tab==="overview"&&(
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                        <div><div style={{fontSize:9,fontWeight:800,color:"#3f3f46",textTransform:"uppercase",letterSpacing:".04em",marginBottom:2}}>Phone</div>{lead.phone?<a href={`tel:${lead.phone}`} style={{fontSize:12,fontWeight:600,color:"#3b82f6",textDecoration:"none"}}>{lead.phone}</a>:<div style={{fontSize:12,fontWeight:600,color:"#a1a1aa"}}>--</div>}</div><DF l="Email" v={lead.email}/>
                        <DF l="Address" v={lead.property_address}/><DF l="City/State" v={`${lead.city}, ${lead.state} ${lead.zip_code}`}/>
                        <DF l="Monthly Bill" v={$.money(lead.average_monthly_bill)} c="#f59e0b"/><DF l="Annual kWh" v={lead.estimated_annual_kwh}/>
                        <DF l="Source" v={sL(lead.source_type)}/><DF l="Property" v={sL(lead.property_type)}/>
                        <DF l="Homeowner" v={sL(lead.homeowner_status)}/><DF l="Created" v={$.dt(lead.created_at)}/>
                        <DF l="Last Outcome" v={sL(lead.last_outcome)}/><DF l="Follow-up" v={lead.next_follow_up_date?$.date(lead.next_follow_up_date):"None"}/>
                        {lead.notes&&<div style={{gridColumn:"span 2",padding:12,background:"#18181b",borderRadius:8}}><div style={{fontSize:10,fontWeight:800,color:"#3f3f46",textTransform:"uppercase",marginBottom:4}}>Notes</div><div style={{fontSize:12,color:"#a1a1aa"}}>{lead.notes}</div></div>}
                    </div>
                )}
                {/* TIMELINE */}
                {tab==="timeline"&&(
                    <div>{Array.isArray(timeline)&&timeline.length>0?
                        <div style={{display:"flex",flexDirection:"column",gap:0}}>
                            {(Array.isArray(timeline)?timeline:(timeline.timeline||[])).map((e,i)=>(
                                <div key={i} style={{display:"flex",gap:10}}>
                                    <div style={{display:"flex",flexDirection:"column",alignItems:"center"}}>
                                        <div className="tl-dot" style={{background:e.entry_type==="action"?"#f59e0b":e.entry_type==="task"?"#3b82f6":"#22c55e"}}/>
                                        {i<(Array.isArray(timeline)?timeline:(timeline.timeline||[])).length-1&&<div className="tl-line" style={{flex:1}}/>}
                                    </div>
                                    <div style={{paddingBottom:14,flex:1}}>
                                        <div style={{fontSize:12,fontWeight:700}}>{sL(e.action_type||e.task_type||e.entry_type)}</div>
                                        <div style={{fontSize:11,color:"#52525b"}}>{e.note||e.description||e.title||""}</div>
                                        <div style={{fontSize:10,color:"#3f3f46",marginTop:2}}>{e.rep_name||""} &middot; {$.dt(e.created_at)}</div>
                                    </div>
                                </div>
                            ))}
                        </div>
                        :<div style={{color:"#3f3f46",fontSize:12,textAlign:"center",padding:20}}>No timeline events</div>
                    }</div>
                )}
                {/* APPOINTMENTS */}
                {tab==="appointments"&&(
                    <div>
                        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
                            <span style={{fontSize:12,fontWeight:700}}>{appts.length} appointments</span>
                            <button className="btn btn-p" onClick={()=>{onClose();onCreateAppt(lead)}}><Ic d={IC.plus} s={11}/> New Appt</button>
                        </div>
                        {appts.map(a=>(
                            <div key={a.id} className="cd" style={{padding:12,marginBottom:6}}>
                                <div style={{display:"flex",justifyContent:"space-between"}}>
                                    <div><div style={{fontSize:13,fontWeight:700}}>{$.date(a.appointment_date)} at {a.appointment_time||"TBD"}</div><div style={{fontSize:11,color:"#52525b"}}>{a.appointment_address}</div></div>
                                    <span className={`badge ${sB(a.appointment_status)}`}>{sL(a.appointment_status)}</span>
                                </div>
                                {a.outcome&&<div style={{fontSize:11,color:"#71717a",marginTop:4}}>Outcome: {sL(a.outcome)}</div>}
                            </div>
                        ))}
                        {appts.length===0&&<div style={{textAlign:"center",color:"#3f3f46",padding:20,fontSize:12}}>No appointments</div>}
                    </div>
                )}
                {/* TASKS */}
                {tab==="tasks"&&(
                    <div>
                        {tasks.filter(t=>t.lead_id===lead.id).length===0?<div style={{textAlign:"center",color:"#3f3f46",padding:20,fontSize:12}}>No tasks</div>:
                        tasks.filter(t=>t.lead_id===lead.id).map(t=>(
                            <div key={t.id} className="cd" style={{padding:12,marginBottom:6,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                                <div><div style={{fontSize:13,fontWeight:700}}>{t.title}</div><div style={{fontSize:10,color:"#52525b"}}>{sL(t.task_type)} &middot; Due {$.date(t.due_date)}</div></div>
                                <div style={{display:"flex",alignItems:"center",gap:6}}>
                                    <span className={`badge ${t.status==="overdue"?"b-red":t.status==="completed"?"b-green":"b-yellow"}`}>{sL(t.status)}</span>
                                    {t.status!=="completed"&&<button className="btn btn-g" style={{fontSize:10,padding:"3px 8px"}} onClick={()=>completeTask(t.id)}>Done</button>}
                                </div>
                            </div>
                        ))}
                    </div>
                )}
                {/* OWNERSHIP */}
                {tab==="ownership"&&(
                    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                        {(()=>{const rn=id=>{if(!id)return"--";const r=reps.find(x=>x.id===id);return r?r.full_name:`Rep #${id}`};return<>
                        <DF l="Setter" v={rn(lead.setter_id)}/><DF l="Runner" v={rn(lead.runner_id)}/>
                        <DF l="Closer" v={rn(lead.closer_id)}/><DF l="Assigned Rep" v={lead.assigned_rep_id?rn(lead.assigned_rep_id):"Unassigned"}/>
                        <DF l="Rehash Rep" v={rn(lead.rehash_rep_id)}/>
                        </>})()}
                        {user?.role==="admin"&&reps.length>0&&(
                            <div style={{gridColumn:"span 2",marginTop:8}}>
                                <div style={{fontSize:10,fontWeight:800,color:"#52525b",textTransform:"uppercase",marginBottom:6}}>Reassign</div>
                                <div style={{display:"flex",flexDirection:"column",gap:4,maxHeight:200,overflowY:"auto"}}>
                                    {reps.map(r=>(
                                        <div key={r.id} className="cd" style={{padding:"8px 12px",display:"flex",justifyContent:"space-between",alignItems:"center",cursor:"pointer",border:lead.assigned_rep_id===r.id?"1px solid #f59e0b":"1px solid #1e1e21"}} onClick={()=>assignRep(r.id)}>
                                            <span style={{fontSize:12,fontWeight:600}}>{r.full_name}</span>
                                            {lead.assigned_rep_id===r.id&&<span className="badge b-orange">Current</span>}
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}
                    </div>
                )}
                {/* ACTIONS */}
                {tab==="actions"&&(
                    <div>
                        {lockInfo&&lockInfo.is_locked&&(
                            <div style={{background:"#ef444418",border:"1px solid #ef444440",borderRadius:8,padding:12,marginBottom:14}}>
                                <div style={{fontSize:11,fontWeight:800,color:"#ef4444",marginBottom:6}}>LEAD LOCKED - {lockInfo.open_task_count} OPEN TASK{lockInfo.open_task_count!==1?"S":""}</div>
                                <div style={{fontSize:10,color:"#fca5a5"}}>This lead cannot be closed or abandoned until all tasks are completed.</div>
                                {lockInfo.tasks&&lockInfo.tasks.map(t=>(
                                    <div key={t.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderTop:"1px solid #ef444420",marginTop:6}}>
                                        <span style={{fontSize:11,color:"#fca5a5"}}>{t.title} ({t.status})</span>
                                        {t.status!=="completed"&&<button className="btn btn-g" style={{fontSize:9,padding:"2px 6px"}} onClick={()=>completeTask(t.id)}>Complete</button>}
                                    </div>
                                ))}
                            </div>
                        )}
                        <div style={{marginBottom:16}}>
                            <div style={{fontSize:10,fontWeight:800,color:"#52525b",textTransform:"uppercase",marginBottom:8}}>Update Status</div>
                            <div style={{display:"flex",flexWrap:"wrap",gap:4}}>
                                {["new","confirmed","appointed","dispatched","closed_won","closed_lost","follow_up","no_show","rehash"].map(s=>(
                                    <button key={s} className={`btn ${lead.deal_status===s?"btn-p":""}`} disabled={lead.deal_status===s||(lockInfo&&lockInfo.is_locked&&["closed_won","closed_lost"].includes(s))} onClick={()=>updStatus(s)}>{sL(s)}</button>
                                ))}
                            </div>
                        </div>
                        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                            <button className="btn btn-p" onClick={()=>{onClose();onCreateAppt(lead)}}>Create Appointment</button>
                            <button className="btn" onClick={()=>sTab("ownership")}>Reassign</button>
                            {user?.role==="admin"&&<button className="btn" style={{background:"#ef444418",color:"#ef4444",border:"1px solid #ef444440"}} disabled={deleting} onClick={deleteLead}>{deleting?"Archiving...":"Archive Lead"}</button>}
                        </div>
                        {user?.role==="admin"&&appts.length>0&&(
                            <div style={{marginTop:16}}>
                                <div style={{fontSize:10,fontWeight:800,color:"#52525b",textTransform:"uppercase",marginBottom:8}}>Admin: Cancel Appointments</div>
                                {appts.filter(a=>!["completed","cancelled"].includes(a.appointment_status)).map(a=>(
                                    <div key={a.id} style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"6px 0",borderBottom:"1px solid #18181b"}}>
                                        <span style={{fontSize:11}}>{$.date(a.appointment_date)} {a.appointment_time||""} - {sL(a.appointment_status)}</span>
                                        <button className="btn" style={{fontSize:9,padding:"2px 8px",color:"#ef4444"}} onClick={()=>cancelAppt(a.id)}>Cancel</button>
                                    </div>
                                ))}
                            </div>
                        )}
                    </div>
                )}
            </div>
        </div></>
    );
}

// ===== CREATE LEAD MODAL =====
function CreateLeadModal({onClose,onDone}){
    const{af}=useA();const toast=useT();const[busy,sBusy]=useState(false);
    const[f,sF]=useState({first_name:"",last_name:"",phone:"",email:"",property_address:"",city:"",state:"CA",zip_code:"",average_monthly_bill:"",source_type:"web",homeowner_status:"owner",property_type:"single_family"});
    const set=(k,v)=>sF(o=>({...o,[k]:v}));
    const submit=async()=>{
        if(!f.first_name||!f.last_name||!f.phone||!f.property_address){toast("err","Fill required fields");return}
        sBusy(true);
        try{const r=await af("/api/leads",{method:"POST",body:JSON.stringify({...f,average_monthly_bill:parseFloat(f.average_monthly_bill)||0})});if(r.ok){toast("ok","Lead created");onDone()}else{const d=await r.json().catch(()=>({}));toast("err",d.detail||"Failed")}}catch{toast("err","Error")}
        sBusy(false);
    };
    const states=["AL","AK","AZ","AR","CA","CO","CT","DE","FL","GA","HI","ID","IL","IN","IA","KS","KY","LA","ME","MD","MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ","NM","NY","NC","ND","OH","OK","OR","PA","RI","SC","SD","TN","TX","UT","VT","VA","WA","WV","WI","WY"];

    return(
        <div className="modal-ov" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}><h3 style={{fontSize:16,fontWeight:800}}>New Lead</h3><div style={{cursor:"pointer"}} onClick={onClose}><Ic d={IC.x}/></div></div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <div><label className="lbl">First Name *</label><input className="inp" value={f.first_name} onChange={e=>set("first_name",e.target.value)}/></div>
                <div><label className="lbl">Last Name *</label><input className="inp" value={f.last_name} onChange={e=>set("last_name",e.target.value)}/></div>
                <div><label className="lbl">Phone *</label><input className="inp" value={f.phone} onChange={e=>set("phone",e.target.value)}/></div>
                <div><label className="lbl">Email</label><input className="inp" value={f.email} onChange={e=>set("email",e.target.value)}/></div>
                <div style={{gridColumn:"span 2"}}><label className="lbl">Address *</label><input className="inp" value={f.property_address} onChange={e=>set("property_address",e.target.value)}/></div>
                <div><label className="lbl">City</label><input className="inp" value={f.city} onChange={e=>set("city",e.target.value)}/></div>
                <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:6}}>
                    <div><label className="lbl">State</label><select className="inp" value={f.state} onChange={e=>set("state",e.target.value)}>{states.map(s=><option key={s}>{s}</option>)}</select></div>
                    <div><label className="lbl">ZIP</label><input className="inp" value={f.zip_code} onChange={e=>set("zip_code",e.target.value)}/></div>
                </div>
                <div><label className="lbl">Monthly Bill</label><input className="inp" type="number" value={f.average_monthly_bill} onChange={e=>set("average_monthly_bill",e.target.value)}/></div>
                <div><label className="lbl">Source</label><select className="inp" value={f.source_type} onChange={e=>set("source_type",e.target.value)}><option value="web">Web</option><option value="door_to_door">Door to Door</option><option value="call_center">Call Center</option><option value="referral">Referral</option></select></div>
            </div>
            <button className="btn btn-p" style={{width:"100%",marginTop:16,padding:12}} disabled={busy} onClick={submit}>{busy?"Creating...":"Create Lead"}</button>
        </div></div>
    );
}

// ===== CREATE APPOINTMENT MODAL =====
function CreateApptModal({lead,reps,onClose,onDone}){
    const{af}=useA();const toast=useT();const[busy,sBusy]=useState(false);
    const[f,sF]=useState({lead_id:lead.id,assigned_rep_id:lead.assigned_rep_id||"",appointment_date:"",appointment_time:"",appointment_address:lead.property_address||"",notes:""});
    const set=(k,v)=>sF(o=>({...o,[k]:v}));
    const submit=async()=>{
        if(!f.assigned_rep_id||!f.appointment_date||!f.appointment_time){toast("err","Fill required fields");return}
        sBusy(true);
        try{const r=await af("/api/appointments",{method:"POST",body:JSON.stringify({...f,assigned_rep_id:parseInt(f.assigned_rep_id)})});if(r.ok){toast("ok","Appointment created");onDone()}else{const d=await r.json().catch(()=>({}));toast("err",d.detail||"Failed")}}catch{toast("err","Error")}
        sBusy(false);
    };
    return(
        <div className="modal-ov" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}><h3 style={{fontSize:16,fontWeight:800}}>New Appointment</h3><div style={{cursor:"pointer"}} onClick={onClose}><Ic d={IC.x}/></div></div>
            <div style={{fontSize:12,color:"#71717a",marginBottom:12}}>For: {lead.first_name} {lead.last_name}</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <div><label className="lbl">Date *</label><input className="inp" type="date" value={f.appointment_date} onChange={e=>set("appointment_date",e.target.value)}/></div>
                <div><label className="lbl">Time *</label><input className="inp" type="time" value={f.appointment_time} onChange={e=>set("appointment_time",e.target.value)}/></div>
                <div style={{gridColumn:"span 2"}}><label className="lbl">Address</label><input className="inp" value={f.appointment_address} onChange={e=>set("appointment_address",e.target.value)}/></div>
                <div style={{gridColumn:"span 2"}}><label className="lbl">Assign Rep *</label><select className="inp" value={f.assigned_rep_id} onChange={e=>set("assigned_rep_id",e.target.value)}><option value="">Select rep...</option>{reps.map(r=><option key={r.id} value={r.id}>{r.full_name}</option>)}</select></div>
                <div style={{gridColumn:"span 2"}}><label className="lbl">Notes</label><textarea className="inp" value={f.notes} onChange={e=>set("notes",e.target.value)}/></div>
            </div>
            <button className="btn btn-p" style={{width:"100%",marginTop:16,padding:12}} disabled={busy} onClick={submit}>{busy?"Creating...":"Create Appointment"}</button>
        </div></div>
    );
}

// ========================================================================
// REPS PAGE
// ========================================================================
function RepsPage(){
    const{af,user}=useA();const toast=useT();const[reps,sReps]=useState([]);const[loading,sLd]=useState(true);const[showInvite,sSI]=useState(false);
    const[sortBy,setSB]=useState("score");

    useEffect(()=>{load()},[sortBy]);
    const load=async()=>{sLd(true);try{
        const url=user?.role==="admin"?`/api/admin/rep-performance?sort_by=${sortBy}`:"/api/admin/reps";
        const r=await af(url);if(r.ok){const d=await r.json();sReps(Array.isArray(d)?d:(d.reps||d.items||[]))}
    }catch{}sLd(false)};

    if(loading)return<Spin/>;
    return(
        <div>
            <PH title="Sales Reps" sub={`${reps.length} reps`} right={<div style={{display:"flex",gap:6,alignItems:"center"}}>
                {user?.role==="admin"&&<select className="inp" style={{width:140,fontSize:11}} value={sortBy} onChange={e=>setSB(e.target.value)}>
                    <option value="score">Sort: Score</option><option value="close_rate">Sort: Close Rate</option><option value="held_rate">Sort: Held Rate</option><option value="violations">Sort: Violations</option><option value="overdue">Sort: Overdue</option>
                </select>}
                <button className="btn btn-p" onClick={()=>sSI(true)}><Ic d={IC.send} s={12}/> Invite Rep</button>
            </div>}/>
            <div style={{padding:"16px 24px"}}>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:10}}>
                    {reps.map((r,idx)=>{
                        const hasViolations=r.active_violations>0;const hasOverdue=r.overdue_tasks>0;
                        return(
                        <div key={r.rep_id||r.id} className="cd" style={{padding:16,border:hasViolations?"1px solid #ef444440":hasOverdue?"1px solid #f59e0b40":"1px solid #1e1e21"}}>
                            <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
                                <div style={{position:"relative"}}>
                                    <div style={{width:40,height:40,borderRadius:"50%",background:idx===0?"#f59e0b28":idx===1?"#a1a1aa18":idx===2?"#cd7f3218":"#18181b",display:"flex",alignItems:"center",justifyContent:"center",color:idx===0?"#f59e0b":"#a1a1aa",fontWeight:900,fontSize:15}}>{(r.name||r.full_name||"?")[0]}</div>
                                    {idx<3&&<div style={{position:"absolute",top:-4,right:-4,width:16,height:16,borderRadius:"50%",background:idx===0?"#f59e0b":idx===1?"#a1a1aa":"#cd7f32",display:"flex",alignItems:"center",justifyContent:"center",fontSize:8,fontWeight:900,color:"#000"}}>{idx+1}</div>}
                                </div>
                                <div style={{flex:1}}>
                                    <div style={{fontWeight:700,fontSize:13}}>{r.name||r.full_name}</div>
                                    <div style={{fontSize:10,color:"#52525b"}}>{r.email}</div>
                                </div>
                                {r.score!==undefined&&<div style={{textAlign:"right"}}><div style={{fontSize:18,fontWeight:900,color:r.score>=200?"#22c55e":r.score>=100?"#f59e0b":"#ef4444"}}>{r.score}</div><div style={{fontSize:8,fontWeight:800,color:"#3f3f46",textTransform:"uppercase"}}>Score</div></div>}
                            </div>
                            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:6,textAlign:"center",marginBottom:8}}>
                                <div><div style={{fontSize:15,fontWeight:900,color:"#22c55e"}}>{r.close_rate!==undefined?r.close_rate+"%":"--"}</div><div style={{fontSize:8,color:"#3f3f46",fontWeight:800,textTransform:"uppercase"}}>Close</div></div>
                                <div><div style={{fontSize:15,fontWeight:900,color:"#3b82f6"}}>{r.held_rate!==undefined?r.held_rate+"%":"--"}</div><div style={{fontSize:8,color:"#3f3f46",fontWeight:800,textTransform:"uppercase"}}>Held</div></div>
                                <div><div style={{fontSize:15,fontWeight:900}}>{r.closed_count||r.total_deals||0}</div><div style={{fontSize:8,color:"#3f3f46",fontWeight:800,textTransform:"uppercase"}}>Closed</div></div>
                                <div><div style={{fontSize:15,fontWeight:900,color:"#f59e0b"}}>{r.total_revenue!==undefined?$.money(r.total_revenue):"--"}</div><div style={{fontSize:8,color:"#3f3f46",fontWeight:800,textTransform:"uppercase"}}>Rev</div></div>
                            </div>
                            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:6,textAlign:"center",padding:"8px 0",borderTop:"1px solid #18181b"}}>
                                <div><div style={{fontSize:13,fontWeight:800}}>{r.total_appointments||0}</div><div style={{fontSize:8,color:"#3f3f46",fontWeight:800,textTransform:"uppercase"}}>Appts</div></div>
                                <div><div style={{fontSize:13,fontWeight:800}}>{r.active_leads||0}</div><div style={{fontSize:8,color:"#3f3f46",fontWeight:800,textTransform:"uppercase"}}>Leads</div></div>
                                <div><div style={{fontSize:13,fontWeight:800,color:hasOverdue?"#ef4444":"inherit"}}>{r.overdue_tasks||0}</div><div style={{fontSize:8,color:hasOverdue?"#ef4444":"#3f3f46",fontWeight:800,textTransform:"uppercase"}}>Overdue</div></div>
                                <div><div style={{fontSize:13,fontWeight:800,color:hasViolations?"#ef4444":"inherit"}}>{r.active_violations||0}</div><div style={{fontSize:8,color:hasViolations?"#ef4444":"#3f3f46",fontWeight:800,textTransform:"uppercase"}}>Violations</div></div>
                            </div>
                        </div>
                    )})}
                </div>
            </div>
            {showInvite&&<InviteModal onClose={()=>sSI(false)} onDone={()=>{sSI(false);load()}}/>}
        </div>
    );
}

function InviteModal({onClose,onDone}){
    const{af}=useA();const toast=useT();const[email,sE]=useState("");const[name,sN]=useState("");const[busy,sBusy]=useState(false);const[link,sLink]=useState("");
    const send=async()=>{if(!email||!name){toast("err","Fill all fields");return}sBusy(true);try{const r=await af("/api/auth/invite",{method:"POST",body:JSON.stringify({email,full_name:name,role:"rep"})});if(r.ok){const d=await r.json();sLink(`${window.location.origin}/register?token=${d.token}`);toast("ok","Invite created")}else{const d=await r.json().catch(()=>({}));toast("err",d.detail||"Failed")}}catch{toast("err","Error")}sBusy(false)};
    const copy=()=>{navigator.clipboard.writeText(link);toast("ok","Copied!")};
    return(
        <div className="modal-ov" onClick={onClose}><div className="modal" onClick={e=>e.stopPropagation()}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:16}}><h3 style={{fontSize:16,fontWeight:800}}>Invite Rep</h3><div style={{cursor:"pointer"}} onClick={onClose}><Ic d={IC.x}/></div></div>
            {!link?(
                <div>
                    <div style={{marginBottom:12}}><label className="lbl">Full Name</label><input className="inp" value={name} onChange={e=>sN(e.target.value)}/></div>
                    <div style={{marginBottom:16}}><label className="lbl">Email</label><input className="inp" type="email" value={email} onChange={e=>sE(e.target.value)}/></div>
                    <button className="btn btn-p" style={{width:"100%",padding:10}} disabled={busy} onClick={send}>{busy?"Creating...":"Create Invite Link"}</button>
                </div>
            ):(
                <div>
                    <div style={{fontSize:12,color:"#71717a",marginBottom:10}}>Send this link to the rep:</div>
                    <div style={{background:"#09090b",border:"1px solid #27272a",borderRadius:8,padding:10,fontSize:11,color:"#f59e0b",wordBreak:"break-all",marginBottom:12}}>{link}</div>
                    <div style={{display:"flex",gap:6}}><button className="btn btn-p" style={{flex:1}} onClick={copy}>Copy Link</button><button className="btn" style={{flex:1}} onClick={onDone}>Done</button></div>
                </div>
            )}
        </div></div>
    );
}

// ========================================================================
// TASKS PAGE
// ========================================================================
function TasksPage(){
    const{af}=useA();const toast=useT();const[tasks,sTasks]=useState([]);const[loading,sLd]=useState(true);const[filter,sF]=useState("pending");
    useEffect(()=>{load()},[filter]);
    const load=async()=>{sLd(true);try{const url=filter?`/api/tasks?status=${filter}`:"/api/tasks";const r=await af(url);if(r.ok){const d=await r.json();sTasks(Array.isArray(d)?d:(d.items||d.tasks||[]))}}catch{}sLd(false)};
    const complete=async id=>{try{const r=await af(`/api/tasks/${id}/complete`,{method:"POST",body:JSON.stringify({completion_notes:"Done"})});if(r.ok){toast("ok","Completed");load()}}catch{toast("err","Failed")}};
    if(loading)return<Spin/>;
    return(
        <div>
            <PH title="Tasks" sub={`${tasks.length}`} right={<div style={{display:"flex",gap:4}}>{["pending","overdue","completed",""].map(f=><button key={f} className={`btn ${filter===f?"btn-p":""}`} onClick={()=>sF(f)}>{f||"All"}</button>)}</div>}/>
            <div style={{padding:"14px 24px"}}>
                {tasks.length===0?<div className="cd" style={{padding:32,textAlign:"center",color:"#3f3f46"}}>No tasks</div>:
                <div className="cd" style={{overflow:"hidden"}}>
                    <div style={{display:"grid",gridTemplateColumns:"2fr 1.5fr .8fr .8fr .5fr",padding:"8px 14px",borderBottom:"1px solid #18181b",fontSize:10,fontWeight:800,color:"#3f3f46",textTransform:"uppercase",letterSpacing:".06em"}}><div>Task</div><div>Lead</div><div>Due</div><div>Status</div><div/></div>
                    {tasks.map(t=>(
                        <div key={t.id} className="tr" style={{gridTemplateColumns:"2fr 1.5fr .8fr .8fr .5fr",display:"grid"}}>
                            <div><div style={{fontWeight:700,fontSize:12}}>{t.title}</div><div style={{fontSize:10,color:"#52525b"}}>{t.task_type}</div></div>
                            <div style={{fontSize:11,color:"#71717a",cursor:"pointer"}} onClick={()=>nav(`/leads?id=${t.lead_id}`)}>{t.lead_name||`#${t.lead_id}`}</div>
                            <div style={{fontSize:11}}>{$.date(t.due_date)}</div>
                            <div><span className={`badge ${t.status==="overdue"?"b-red":t.status==="completed"?"b-green":"b-yellow"}`}>{sL(t.status)}</span></div>
                            <div>{t.status!=="completed"&&<button className="btn btn-g" style={{fontSize:9,padding:"2px 6px"}} onClick={()=>complete(t.id)}>Done</button>}</div>
                        </div>
                    ))}
                </div>}
            </div>
        </div>
    );
}

// ========================================================================
// PIPELINE (LEAD STATUS KANBAN)
// ========================================================================
function PipelinePage(){
    const{af}=useA();const[leads,setLeads]=useState([]);const[loading,sLd]=useState(true);
    useEffect(()=>{load()},[]);const load=async()=>{sLd(true);try{const r=await af("/api/leads?limit=500");if(r.ok){const d=await r.json();setLeads(Array.isArray(d)?d:(d.items||[]))}}catch{}sLd(false)};
    const stages=[{k:"new",l:"New",c:"#3b82f6"},{k:"confirmed",l:"Confirmed",c:"#22c55e"},{k:"appointed",l:"Appointed",c:"#f59e0b"},{k:"dispatched",l:"Dispatched",c:"#a855f7"},{k:"closed_won",l:"Won",c:"#22c55e"},{k:"closed_lost",l:"Lost",c:"#ef4444"}];
    const grouped=useMemo(()=>{const g={};stages.forEach(s=>g[s.k]=[]);leads.forEach(l=>{const s=l.deal_status||"new";if(g[s])g[s].push(l);else if(g.new)g.new.push(l)});return g},[leads]);
    if(loading)return<Spin/>;
    return(
        <div>
            <PH title="Pipeline" sub="Deal flow"/>
            <div style={{padding:"14px 24px",overflowX:"auto"}}>
                <div style={{display:"flex",gap:10,minWidth:stages.length*200}}>
                    {stages.map(s=>(
                        <div key={s.k} style={{flex:1,minWidth:180}}>
                            <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:8,paddingBottom:6,borderBottom:`2px solid ${s.c}30`}}><div style={{width:7,height:7,borderRadius:"50%",background:s.c}}/><span style={{fontSize:11,fontWeight:800,color:"#71717a"}}>{s.l}</span><span style={{fontSize:10,color:"#3f3f46",marginLeft:"auto"}}>{(grouped[s.k]||[]).length}</span></div>
                            <div style={{display:"flex",flexDirection:"column",gap:5}}>
                                {(grouped[s.k]||[]).map(l=>(
                                    <div key={l.id} className="cd" style={{padding:10,borderLeft:`3px solid ${s.c}`,cursor:"pointer"}} onClick={()=>nav(`/leads?id=${l.id}`)}>
                                        <div style={{fontWeight:700,fontSize:11}}>{l.first_name} {l.last_name}</div><div style={{fontSize:10,color:"#52525b"}}>{l.city}, {l.state}</div>
                                        <div style={{fontSize:11,fontWeight:700,marginTop:4,color:s.c}}>{$.money(l.average_monthly_bill)}/mo</div>
                                    </div>
                                ))}
                                {(grouped[s.k]||[]).length===0&&<div style={{padding:16,textAlign:"center",color:"#27272a",fontSize:10,border:"1px dashed #1e1e21",borderRadius:6}}>Empty</div>}
                            </div>
                        </div>
                    ))}
                </div>
            </div>
        </div>
    );
}

// ========================================================================
// PROJECTS PAGE (POST-SALE PIPELINE)
// ========================================================================
function ProjectsPage(){
    const{af}=useA();const[data,sData]=useState(null);const[deals,sDeals]=useState([]);const[loading,sLd]=useState(true);
    useEffect(()=>{load()},[]);
    const load=async()=>{sLd(true);try{
        const[pr,dr]=await Promise.all([af("/api/deals/pipeline"),af("/api/deals")]);
        if(pr.ok)sData(await pr.json());
        if(dr.ok)sDeals(await dr.json());
    }catch{}sLd(false)};

    const stages=[{k:"sold",l:"Sold",c:"#f59e0b"},{k:"installed",l:"Installed",c:"#3b82f6"},{k:"submitted_for_funding",l:"Submitted",c:"#a855f7"},{k:"funded",l:"Funded",c:"#22c55e"},{k:"paid",l:"Paid",c:"#22c55e"}];

    if(loading)return<Spin/>;
    const pipeline=data?.pipeline||{};

    return(
        <div>
            <PH title="Projects" sub="Post-sale pipeline"/>
            <div style={{padding:"16px 24px"}}>
                <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
                    {stages.map(s=>{const d=pipeline[s.k]||{count:0,total_value:0};return<KPI key={s.k} l={s.l} v={`${d.count} (${$.money(d.total_value)})`} t={s.k==="paid"?"ok":null}/>})}
                </div>
                <div style={{display:"flex",gap:10,overflowX:"auto"}}>
                    {stages.map(s=>{
                        const sd=(Array.isArray(deals)?deals:[]).filter(d=>d.pipeline_stage===s.k);
                        return(
                            <div key={s.k} style={{flex:1,minWidth:180}}>
                                <div style={{display:"flex",alignItems:"center",gap:5,marginBottom:8,paddingBottom:6,borderBottom:`2px solid ${s.c}30`}}><div style={{width:7,height:7,borderRadius:"50%",background:s.c}}/><span style={{fontSize:11,fontWeight:800,color:"#71717a"}}>{s.l}</span><span style={{fontSize:10,color:"#3f3f46",marginLeft:"auto"}}>{sd.length}</span></div>
                                <div style={{display:"flex",flexDirection:"column",gap:5}}>
                                    {sd.map(d=>(
                                        <div key={d.id} className="cd" style={{padding:10,borderLeft:`3px solid ${s.c}`}}>
                                            <div style={{fontWeight:700,fontSize:11}}>Deal #{d.id}</div>
                                            <div style={{fontSize:11,fontWeight:700,marginTop:4,color:s.c}}>{$.money(d.deal_value)}</div>
                                        </div>
                                    ))}
                                    {sd.length===0&&<div style={{padding:16,textAlign:"center",color:"#27272a",fontSize:10,border:"1px dashed #1e1e21",borderRadius:6}}>Empty</div>}
                                </div>
                            </div>
                        );
                    })}
                </div>
            </div>
        </div>
    );
}

// ========================================================================
// SHARED COMPONENTS
// ========================================================================
function PH({title,sub,right}){return<div style={{padding:"16px 24px 12px",borderBottom:"1px solid #18181b",display:"flex",alignItems:"center",justifyContent:"space-between"}}><div><h1 style={{fontSize:18,fontWeight:900}}>{title}</h1>{sub&&<p style={{color:"#3f3f46",fontSize:11,marginTop:1}}>{sub}</p>}</div>{right}</div>}
function KPI({l,v,t}){return<div className={`kpi ${t||""}`}><div style={{fontSize:9,fontWeight:800,color:"#3f3f46",textTransform:"uppercase",letterSpacing:".06em",marginBottom:3}}>{l}</div><div style={{fontSize:18,fontWeight:900,color:t==="hot"?"#ef4444":t==="warn"?"#f59e0b":t==="ok"?"#22c55e":"#e4e4e7"}}>{v}</div></div>}
function SH({title,count}){return<div style={{display:"flex",alignItems:"center",gap:6,marginBottom:8}}><span style={{fontSize:11,fontWeight:800,color:"#52525b",textTransform:"uppercase",letterSpacing:".05em"}}>{title}</span>{count!=null&&<span style={{fontSize:10,color:"#3f3f46"}}>{count}</span>}</div>}
function DF({l,v,c}){return<div><div style={{fontSize:9,fontWeight:800,color:"#3f3f46",textTransform:"uppercase",letterSpacing:".04em",marginBottom:2}}>{l}</div><div style={{fontSize:12,fontWeight:600,color:c||"#a1a1aa"}}>{v||"--"}</div></div>}
function TaskRow({t,compact}){return<div style={{padding:compact?"6px 0":"8px 12px",borderBottom:"1px solid #18181b20",display:"flex",justifyContent:"space-between",alignItems:"center"}}><div><div style={{fontSize:compact?11:12,fontWeight:600}}>{t.title}</div><div style={{fontSize:10,color:"#3f3f46"}}>Due {$.date(t.due_date)}</div></div><span className={`badge ${t.status==="overdue"?"b-red":"b-yellow"}`}>{sL(t.status)}</span></div>}
function Spin(){return<div style={{display:"flex",justifyContent:"center",padding:60}}><div className="spin"/></div>}

// ========================================================================
// APP
// ========================================================================
function Shell(){
    const h=useH();const p=h.split("?")[0];
    const routes={"/dashboard":DashboardPage,"/dispatch":DispatchPage,"/leads":LeadsPage,"/reps":RepsPage,"/tasks":TasksPage,"/pipeline":PipelinePage,"/projects":ProjectsPage};
    const P=routes[p]||DashboardPage;
    return<div><Sidebar/><div className="mc"><P/></div></div>;
}

function App(){const{user,loading}=useA();if(loading)return<div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center"}}><div className="spin"/></div>;if(!user)return<Login/>;return<Shell/>}

ReactDOM.createRoot(document.getElementById("root")).render(<AP><TP><App/></TP></AP>);
</script>
<style>.lbl{display:block;font-size:10px;font-weight:800;color:#52525b;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}</style>
</body>
</html>
